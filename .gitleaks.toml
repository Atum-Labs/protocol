# Secret-scanning policy for protocol (CORE-2485).
#
# Extends the gitleaks default ruleset with the credential shapes this repo has
# actually leaked or is likely to leak, and allowlists the deterministic test
# material and public identifiers the working tree carries on purpose. Every
# allowlist entry below is justified in the pre-publication audit report
# (audit/pre-publication-2026-09-16.md, CORE-2485); add nothing here without
# adding a row there.

title = "protocol"

[extend]
useDefault = true

# Alchemy app keys embedded in RPC URLs. The default ruleset has no Alchemy
# rule, which is how one key sat in 28 fork-test configs from the July contract
# import (1575c173) until the scrub in 5386f88a without a detector firing.
[[rules]]
id = "alchemy-api-key"
description = "Alchemy app key embedded in an RPC URL"
regex = '''(?:https?|wss?)://[a-z0-9-]+\.g\.alchemy\.com/v2/([A-Za-z0-9_-]{16,})'''
secretGroup = 1
keywords = ["alchemy.com"]

[rules.allowlist]
# The key the pre-publication audit found in history. Its value stays out of
# this file on purpose; the commits that introduced it are pinned instead. The
# Alchemy app is inactive (rejects with 403 "App is inactive"); the audit report
# records it as `rotated`, with the timestamp tracked on CORE-2498.
commits = [
  "1575c1733457a182004ca2143b6c57c8d7af5962",
  "00abb8ff548f9ec8e032b966abe55156ad6d2f85",
  "1d11a479060c8999cb72c7f1650868f062944f69",
]

# A 32-byte hex private key used as a shell-style default (`${VAR:-0x...}`),
# assigned to a signer/private-key/secret variable, or declared as a constant.
# Test fixtures are allowlisted by value below so the rule stays focused on
# config and source.
[[rules]]
id = "evm-private-key-literal"
description = "EVM/Tron 32-byte private key literal in config or source"
regex = '''(?i)(?:private[_-]?key[A-Z0-9_]*|priv[_-]?key[A-Z0-9_]*|signer|secret|mnemonic)[^\n]{0,40}?\b(?:0x)?([0-9a-fA-F]{64})\b'''
secretGroup = 1
keywords = ["private_key", "privatekey", "private-key", "privkey", "priv_key", "signer", "secret", "mnemonic"]

[rules.allowlist]
regexes = [
  # Obviously fake keys: all zeros (the TronBox CI dummy), all ones (the TronWeb
  # README example), the all-zeros-then-one constant, and the repeated-0x46
  # wallet-core derivation test vector in contracts/tvm/deploy/import-deployer.sh.
  '''0{64}''',
  '''1{64}''',
  '''0{63}1''',
  '''(?:46){32}''',
  # Placeholder key shapes from env examples and docs.
  '''(?:1234567890abcdef){4}''',
]

# A 32-byte hex value assigned to any name at all (`FOO="0x..."`, `deployer: 0x...`,
# `const k = '0x...'`). The rule above needs a key-ish word nearby; this one does
# not, so a key under a neutral name is still reported. The price is that every
# typehash, salt, role id and digest assigned in the tree needs an allowlist row
# below, each justified in the audit report.
[[rules]]
id = "hex-64-assigned"
description = "32-byte hex literal assigned to a variable, field or constant"
regex = '''(?i)[A-Za-z_][A-Za-z0-9_.-]*\s*[:=]\s*["'`]?(?:0x)?([0-9a-f]{64})\b'''
secretGroup = 1

[rules.allowlist]
# Matched against the whole line, so the NAME the value is assigned to can clear it:
# a hash, digest, salt, checksum, topic, id or documented example is not a key,
# whatever its value. A key assigned to such a name is the residual risk, and the
# keyword rule above still covers the key-ish names.
#
# No `(?i)` anywhere in this list, on purpose: gitleaks joins a rule's allowlist
# regexes into one alternation, so a case-insensitive flag on one of them applies
# to every one after it and turns the segment anchoring below into substring
# matching (`Id` would then clear `validatorSeed`). Casings are spelled out.
regexTarget = "line"
regexes = [
  # Long tokens may appear anywhere in the name.
  '''[A-Za-z0-9_.-]*(?:hash|Hash|HASH|digest|Digest|DIGEST|checksum|Checksum|CHECKSUM|typehash|Typehash|TYPEHASH|commitment|Commitment|COMMITMENT|sha256|Sha256|SHA256|signature|Signature|SIGNATURE|example|Example|EXAMPLE|preimage|Preimage|PREIMAGE|witness|Witness|WITNESS|domain|Domain|DOMAIN|separator|Separator|SEPARATOR|blockhash|Blockhash|BLOCKHASH|anchor|Anchor|ANCHOR|oracle|Oracle|ORACLE|pubkey|Pubkey|PUBKEY|pub_hex|Pub_hex|PUB_HEX|pubhex|Pubhex|PUBHEX|depositor|Depositor|DEPOSITOR|sample|Sample|SAMPLE)[A-Za-z0-9_.-]*\s*[:=]''',
  # Short tokens must be a whole name segment: a snake_case / UPPER_CASE segment
  # (optionally followed by digits, as in TOPIC0), a camelCase segment after a
  # lowercase letter or digit, or a leading lowercase camelCase segment. So
  # `tx_id`, `DEPOSITED_TOPIC0`, `depositId`, `txAnchor` are cleared; `validatorSeed`,
  # `bridgeOperator`, `liquiditySource`, `roleValue` are reported.
  '''(?:^|[^A-Za-z0-9_])(?:[A-Za-z0-9]+[_.-])*(?:id|ID|pid|PID|tx|TX|sig|SIG|root|ROOT|node|NODE|leaf|LEAF|slot|SLOT|mint|MINT|order|ORDER|topic|TOPIC|salt|SALT|proof|PROOF|nonce|NONCE|txid|TXID)[0-9]*(?:[_.-][A-Za-z0-9_.-]*)?\s*[:=]''',
  '''[a-z0-9](?:Id|ID|Pid|PID|Tx|TX|Sig|SIG|Root|ROOT|Node|NODE|Leaf|LEAF|Slot|SLOT|Mint|MINT|Order|ORDER|Topic|TOPIC|Salt|SALT|Proof|PROOF|Nonce|NONCE|Txid|TXID)[0-9]*(?:[A-Z][A-Za-z0-9_.-]*)?\s*[:=]''',
  '''(?:^|[^A-Za-z0-9_])(?:id|pid|tx|sig|root|node|leaf|slot|mint|order|topic|salt|proof|nonce|txid)[0-9]*[A-Z][A-Za-z0-9_.-]*\s*[:=]''',
  # Test-vector names in Go/TS tables and the keccak role ids exported by the deploy scripts.
  '''\b(?:[Ww]ant[A-Za-z0-9_]*|[Ee]xpected[A-Za-z0-9_]*|[Ii]nput|[Oo]ther|[Mm]essage|str|R_[A-Z]+)\s*[:=]''',
  # Small integers padded to 32 bytes (Foundry `vm.sign` toy keys), repeated-byte
  # fillers (0202..., 2222...) in encoding tests, and the secp256k1 curve order.
  '''(?:0x)?0{40,}[0-9a-fA-F]{1,24}\b''',
  '''(?:0[0-9a-fA-F]){32}''',
  '''(?:22){32}''',
  '''(?:99){32}''',
  '''FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141''',
  # Same placeholder shapes as evm-private-key-literal.
  '''0{64}''',
  '''1{64}''',
  '''0{63}1''',
  '''(?:46){32}''',
  '''(?:1234567890abcdef){4}''',
  '''(?:1234567890ABCDEF){4}''',
]

# Solana keypair files are JSON arrays of 64 bytes (32-byte seed + 32-byte
# public key). The default ruleset has no detector for them.
[[rules]]
id = "solana-keypair-json"
description = "Solana 64-byte keypair as a JSON byte array"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''

[rules.allowlist]
# The eleven throwaway localnet keypairs in contracts/svm/accounts/ (and, byte
# for byte, at contracts/svm/docker/keypairs/ in the July import 1575c173),
# documented as such in contracts/svm/docker/accounts.sh. The audit verified every
# derived public key holds 0 lamports and has no signatures on mainnet-beta and
# devnet. Pinned by the first six bytes of each array, not by path, so a new
# keypair file dropped into the same directory is still reported.
regexes = [
  '''^\[\s*137\s*,\s*155\s*,\s*18\s*,\s*146\s*,\s*131\s*,\s*204\s*,''',
  '''^\[\s*81\s*,\s*229\s*,\s*64\s*,\s*127\s*,\s*10\s*,\s*91\s*,''',
  '''^\[\s*213\s*,\s*28\s*,\s*194\s*,\s*73\s*,\s*232\s*,\s*34\s*,''',
  '''^\[\s*255\s*,\s*85\s*,\s*119\s*,\s*176\s*,\s*76\s*,\s*97\s*,''',
  '''^\[\s*182\s*,\s*224\s*,\s*240\s*,\s*90\s*,\s*194\s*,\s*5\s*,''',
  '''^\[\s*187\s*,\s*100\s*,\s*28\s*,\s*73\s*,\s*9\s*,\s*8\s*,''',
  '''^\[\s*52\s*,\s*30\s*,\s*230\s*,\s*111\s*,\s*95\s*,\s*175\s*,''',
  '''^\[\s*149\s*,\s*143\s*,\s*242\s*,\s*126\s*,\s*245\s*,\s*51\s*,''',
  '''^\[\s*146\s*,\s*68\s*,\s*114\s*,\s*105\s*,\s*12\s*,\s*168\s*,''',
  '''^\[\s*85\s*,\s*233\s*,\s*71\s*,\s*14\s*,\s*149\s*,\s*40\s*,''',
  '''^\[\s*221\s*,\s*169\s*,\s*42\s*,\s*47\s*,\s*21\s*,\s*2\s*,''',
]

# Solana 64-byte secret keys are 87-88 base58 characters. Public keys are 43-44
# characters and do not match.
[[rules]]
id = "solana-secret-key"
description = "Solana base58-encoded 64-byte secret key"
regex = '''\b([1-9A-HJ-NP-Za-km-z]{87,88})\b'''
secretGroup = 1
entropy = 4.5

[allowlist]
description = "Deterministic, publicly known test material and public identifiers"
paths = [
  # Git submodules (forge-std, permit2): third-party code that this repository
  # holds only as a gitlink. CI does not check them out; a local run with
  # submodules initialised would otherwise report their own test fixtures.
  '''^contracts/[a-z]+/source/lib/''',
  # Generated bindings and schema output: enum literals and quoted CAIP examples
  # trip generic-api-key. Anchored to the directories the generators write to, so
