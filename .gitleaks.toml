  '''^schemas/apis/payment-gateway/v1/bindings/typescript/client/src/generated/[^/]+\.gen\.ts$''',
  '''^schemas/apis/[a-z0-9-]+/v[0-9]+/bindings/typescript/src/[^/]+\.gen\.ts$''',
