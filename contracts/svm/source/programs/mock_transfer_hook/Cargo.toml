[package]
name = "mock_transfer_hook"
version = "0.1.0"
description = "Mock TransferHook program for testing Token-2022 TransferHook extension"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[lints]
workspace = true

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token"] }
spl-token-2022 = { version = "7", features = ["no-entrypoint"] }
spl-transfer-hook-interface = "2.1.0"
spl-discriminator = "0.5.1"
spl-tlv-account-resolution = "0.11.1"
spl-type-length-value = "0.9.0"
