[workspace]
members = [
    "programs/*",
    "crates/*",
]
resolver = "2"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(feature, values("custom-heap", "custom-panic"))',
    'cfg(feature, values("anchor-debug"))',
    'cfg(target_os, values("solana"))',
]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
