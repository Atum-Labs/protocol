name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-tools-1.21-abigen
          restore-keys: |
            ${{ runner.os }}-go-tools-1.21-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Foundry artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
            ~/.foundry
          key: ${{ runner.os }}-foundry-${{ hashFiles('foundry.toml', 'lib/**') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Install contract dependencies
        run: make deps

      - name: Show Forge version
        run: |
          forge --version

      - name: Check Forge formatting
        run: |
          forge fmt --check
        id: fmt

      - name: Aderyn Check
        uses: Cyfrin/aderyn-ci@v0
        with:
          fail-on: high

      - name: Build contracts and generate ABIs
        run: make build
        id: build
        env:
          ETH_MAINNET_RPC: ${{ secrets.ETH_MAINNET_RPC }} 
          PERMIT2_ADDRESS: ${{ vars.PERMIT2_ADDRESS }}

      - name: Check ABIs are up to date
        run: make check-abi

      - name: Test contracts
        run: make test-gas-snapshot
        id: test
        env:
          ETH_MAINNET_RPC: ${{ secrets.ETH_MAINNET_RPC }} 
          PERMIT2_ADDRESS: ${{ vars.PERMIT2_ADDRESS }}
          SALT: ${{ vars.SALT }}

      - name: Test token forks
        run: make test-token-forks
        id: test-token-forks
