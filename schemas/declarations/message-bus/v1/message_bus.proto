syntax = "proto3";

package atum.pubsub.v1;
option go_package = "github.com/atum-labs/protocol/schemas/declarations/message-bus/v1/bindings/go;pubsubv1";

import "google/protobuf/timestamp.proto";

// ============ PubSub Message Envelopes ============
// These are the actual messages published to PubSub topics

// Published by Payment Gateway → consumed by Settler Gateway
// Topic: {chain_name} (e.g., "ethereum", "polygon")
message PaymentRequestEnvelope {
  string payment_request_json = 1;          // Raw JSON-LD (preserves signatures)
  string request_id = 2;                    // From payment request
  string transfer_id = 3;                    // TODO: This field is deprecated and will be removed from the protocol
  string auction_id = 4;                     // Generated by payment gateway
  // Generated by payment gateway. EMPTY payment_id is the quote-phase
  // discriminator: at quote time no deposit exists yet (payment_id is the keccak
  // of the spend authorization, materialized only at award time on the Quote-API
  // flow), so the publisher leaves it empty even when a quote-request carries
  // sender_auth. This empty-payment_id invariant replaced the removed
  // ChainEnvelope oneof; the quote-phase projection is handled in the settler gateway.
  string payment_id = 5;
  google.protobuf.Timestamp timestamp = 6;
  // Originator-signed PaymentRequestEnvelope JSON-LD
  // (the W3C VerifiablePresentation envelope wrapping the inner
  // PaymentRequest with the originator's holder VP). Mirrors the
  // FulfillmentQuoteEnvelope.presentation_json field for
  // the settler side. Forwarded VERBATIM: decoding it into a type that
  // does not model every member drops content and breaks the holder's W3C
  // Data Integrity proof (key order and whitespace do not matter). Empty on
  // originators that don't supply a PRE; the consumer
  // gates per its verification mode (audit /
  // permissive / strict).
  string presentation_json = 7;
}

// Published by Settler Gateway → consumed by Payment Gateway
// Topic: quotes.{request_id}
message FulfillmentQuoteEnvelope {
  oneof result {
    string fulfillment_quote_json = 1;      // Success: Raw JSON from settler agent
    string error_json = 2;                  // Error: AtumError JSON
  }
  string request_id = 3;                    // For correlation
  string transfer_id = 4;                   // TODO: This field is deprecated and will be removed from the protocol
  string settler_id = 5;                     // Which settler provided the quote (or had error)
  string agent_id = 6;                      // Which agent provided quote (or had error)
  string auction_id = 7;                     // Generated by payment gateway
  google.protobuf.Timestamp timestamp = 8;
  // Holder-signed VP envelope propagated from the
  // agent's SubmitBid.presentation so the payment gateway
  // can re-verify defense-in-depth alongside the settler gateway's perimeter
  // check. Forwarded VERBATIM: decoding it into a type that does not
  // model every member drops content and breaks the holder's W3C Data
  // Integrity proof (key order and whitespace do not matter). Empty on success-path
  // bids from settlers OR on error_json bids; the consumer
  // gates per its verification mode (audit / permissive / strict).
  string presentation_json = 9;
}

// Published by Payment Gateway → consumed by Settler Gateway
// Topic: bid_acceptance.{settler_id}.{request_id} (legacy) or {namespace}.bidacceptance (static)
message BidAwardEnvelope {
  string bid_award_json = 1;                // Contains signed authorization
  string request_id = 2;                    // Original request ID
  string transfer_id = 3;                   // TODO: This field is deprecated and will be removed from the protocol
  string agent_id = 4;                      // Which agent provided quote (or had error)
  string auction_id = 5;                     // Generated by payment gateway
  google.protobuf.Timestamp timestamp = 6;
  string settler_id = 7;                     // Target settler for routing (required for static topics)
  // Quote API additions (proto3-additive; empty on single-payment-flow awards, where auction_id == payment_id).
  string payment_id = 8;                    // Quote-API settlement key: the settler gateway + settler key settlement on this. auction_id stays = quote_request_id for batch correlation/logging only.
  // The payer's deposit authorization for a Quote API award: the sender_auth object of the
  // PaymentRequest, as a JSON string. Required on a Quote API award; an empty or malformed
  // value is refused. Consumers may decode and re-encode it: the signatures cover message,
  // message_prehash and signature, which survive re-encoding; payload is unsigned.
  string sender_auth_json = 9;
  // the Atum-signed BidAwardEnvelope JSON-LD —
  // a W3C VerifiablePresentation, holder = the Atum award authority did:pkh,
  // carrying a `quoteAwarder` KnownToAtum VC and bound to this award via
  // proof.challenge = award_hash(payment_id, quote_hash, settler_id). Lets the
  // settler verify WHO authorized the award (off-chain authority) and reject a
  // forged/unauthorized BidAward before committing settlement effort.
  // Forwarded VERBATIM by the settler gateway into the settler's BidAwarded.presentation:
  // decoding it into a type that does not model every member drops content and breaks the
  // holder's W3C Data Integrity proof (key order and whitespace do not matter). Empty when the
  // gateway's award-authority signing is disabled/unconfigured (back-compat with
  // earlier settlers); the settler gates per its own verification mode.
  string presentation_json = 10;
  // The canonical quote_hash of the awarded FulfillmentQuote,
  // computed by the payment gateway over the stored quote and forwarded to the settler as
  // BidAwarded.quote_hash. The settler recomputes award_hash(payment_id,
  // quote_hash, settler_id) from these wire fields and asserts it equals the VP's
  // proof.challenge — binding the identical value the gateway signed WITHOUT
  // re-deriving quote_hash from the lossy re-marshaled bid_award_json. Empty when
  // award-authority signing is disabled (no presentation to bind).
  string quote_hash = 11;
}

// One on-chain transaction belonging to a payment.
message SettlementTransaction {
  string transaction_hash = 1;  // EVM/Tron tx hash or Solana signature
  string chain_id = 2;          // CAIP-2 (e.g. "eip155:137")
  optional uint64 block_number = 3;  // block it mined in; absent until it is known
}

// Non-terminal progress towards a settlement that has not finished. A transaction is on chain
// but its chain has not yet judged it final, so the payment is neither delivered nor failed.
//
// One named slot per movement the originator is shown, matching the pair the payment gateway
// exposes on a payment: committing the payer's funds on the source chain, and paying the
// recipient on the destination chain. There is deliberately no slot for releasing the escrow
// to the settler, which is settlement bookkeeping rather than a movement the originator is
// shown, or for refunding it, which refund_outcome reports. The publisher sets
// whichever slot it has just learned about and leaves the other empty; a reader fills what it
// is given and never clears a slot an earlier message filled.
//
// Best-effort by design, and losing one is never a correctness problem: the terminal arms remain
// the only thing that resolves a payment. What it costs is what the originator is shown - with
// nothing published, their payment reads as pending for the whole finality window with no
// transaction to look at, which is the behaviour this exists to improve on. That is why it stays
// off the money path: it must never be retried, blocked on, or made a precondition for anything.
message SettlementProgress {
  SettlementTransaction deposit = 1;
  SettlementTransaction fulfillment = 2;
}

// Where a payment the settler will not deliver stands in its refund.
//
// refunding is not terminal. refund_available is not terminal either: the deposit is still in
// escrow, so the publisher follows it with refunded once the refund lands, or with
// fulfillment_confirmation_json if a late delivery is released first. refunded is terminal: the
// publisher sends no further arm after it, and a reader ignores any that arrives. The publisher
// never sends this arm after fulfillment_confirmation_json or error_json for the same payment,
// never sends refunding or error_json after refund_available, and never sends both refunded and
// fulfillment_confirmation_json for one payment.
// Unlike settlement_progress, skipping this arm loses the payment's outcome, so every reader
// must handle it before any publisher emits it.
message RefundOutcome {
  oneof state {
    // A verified give-up is on file and the settler is refunding.
    Refunding refunding = 1;
    // veri-fill signed a refund the originator can submit to the source escrow itself. A late
    // delivery can still be released first, so this is not terminal.
    RefundSignature refund_available = 2;
    // The source escrow refunded the deposit.
    Refunded refunded = 3;
  }
}

message Refunding {
  // The settler's give-up error as AtumError JSON, the same value a failed payment carries in
  // error_json. Empty when a REFUND report started the refund.
  string error_json = 1;
}

// The refund authorization veri-fill signed, copied from its POST /v1/refund answer.
message RefundSignature {
  string signature = 1;        // 0x-prefixed hex on eip155 and tron, unprefixed hex on solana
  string message_hash = 2;     // hex, no 0x prefix
  // The signed message as JSON. On eip155 and tron it carries the RefundWitness refund() takes.
  string message_prehash = 3;
}

message Refunded {
  // Absent when veri-fill observed no refund transaction (it learned of the refund from a
  // destination scan).
  SettlementTransaction refund = 1;
  // What the escrow paid out in the refund, in the token's base units, as a decimal string. Set only
  // on a solana source, where the escrow refunds the deposit account's whole balance, and only
  // with refund. Absent means unknown, never zero.
  optional string amount = 2;
  // Whether amount is less than the deposit. Absent when the deposit amount could not be read.
  optional bool partial = 3;
}

// Whether the Settler Gateway recorded the payment's award, so the Payment Gateway can decide a
// payment whose BidAward publish errored without guessing whether a settler was told.
//
// Not terminal. The publisher stores it in the same transaction as the decision it reports, so it
// is sent if and only if that decision was made, and before any other arm for the payment. The two
// states exclude each other: one payment gets at most one of them. Delivery is at least once, so a
// reader ignores a repeat and one for a payment already past awaiting its award. The envelope's
// agent_id names the awarded settler on recorded and is empty on not_awarded.
// A reader that skips this arm loses no outcome: the terminal arms still resolve the payment, and
// only a payment whose award publish errored waits longer.
message AwardOutcome {
  oneof state {
    // The award was recorded and its BidAwarded has been, or will be, sent to the settler.
    AwardRecorded recorded = 1;
    // The auction closed with no award recorded. No settler was or will be told of an award.
    AwardNotRecorded not_awarded = 2;
  }
}

message AwardRecorded {}

message AwardNotRecorded {}

// Published by Settler Gateway → consumed by Payment Gateway
// Topic: result.{request_id}
message FulfillmentResultEnvelope {
  oneof result {
    string fulfillment_confirmation_json = 1;  // Success case
    string error_json = 2;                     // AtumError JSON
    // NOT terminal, unlike the two arms above: the payment is still in flight. A reader that
    // does not recognise this arm sees both string getters return empty, so a reader MUST treat
    // an envelope carrying no arm it knows as something to skip, never as a malformed message to
    // reject. A reader that rejects it stops resolving that payment at all: it reaches no terminal
    // state, the originator is told it is pending indefinitely, and only a human can recover it.
    SettlementProgress settlement_progress = 9;
    // Terminal for refunded. See RefundOutcome for the ordering rules.
    RefundOutcome refund_outcome = 10;
    // NOT terminal. Whether the payment's award reached the publisher. See AwardOutcome.
    AwardOutcome award_outcome = 11;
  }
  string request_id = 3;                       // For correlation
  string transfer_id = 4;                      // TODO: This field is deprecated and will be removed from the protocol
  string agent_id = 5;                         // Which agent provided quote (or had error)
  string auction_id = 6;                         // Generated by payment gateway
  google.protobuf.Timestamp timestamp = 7;
  // Quote API addition (proto3-additive; empty on the single-payment flow).
  string payment_id = 8;                       // Quote-API settlement key
}

// Published by Settler Gateway → consumed by Payment Gateway
// Topic: fulfillment_authorized.{request_id}
// The originator is authorized to fulfill. Settlement has not occurred.
message FulfillmentAuthorizedEnvelope {
  // Signed FulfillmentAuthorization JSON (declarations/FulfillmentAuthorization/v1),
  // forwarded VERBATIM: decoding it into a type that does not model every member drops
  // content and breaks its identity proof (key order and whitespace do not matter).
  string fulfillment_authorization_json = 1;
  string request_id = 2;
  string payment_id = 3;
  string agent_id = 4;
  google.protobuf.Timestamp timestamp = 6;
}

// ============ Authorization Message Envelopes ============
// Messages exchanged between Payment Gateway and Counterparty Gateway
// for counterparty authorization of payments before settlement.

// Published by Payment Gateway → consumed by Counterparty Gateway
// Topic: {namespace}.auth_request
// Key: payment_id (for partition routing and correlation)
message AuthorizationRequestEnvelope {
  string payment_request_json = 1;             // Raw PaymentRequest JSON (preserves JSON-LD signatures)
  string counterparty_did = 2;                 // DID of the beneficiary PSP (routing key for webhook lookup)
  string payment_id = 3;                       // Correlation key (also used as Kafka message key)
  string request_id = 4;                       // Original request ID from PaymentRequest
  google.protobuf.Timestamp timestamp = 5;
  // Originator-signed PaymentRequestEnvelope
  // JSON-LD (the W3C VerifiablePresentation envelope wrapping the inner
  // PaymentRequest with the originator's holder VP). Mirrors the
  // PaymentRequestEnvelope.presentation_json field on the chain topic.
  // Forwarded VERBATIM: decoding it into a type that does not model every
  // member drops content and breaks the holder's W3C Data Integrity proof
  // (key order and whitespace do not matter). Empty on originators that
  // don't supply a PRE; the counterparty gateway gates per its
  // verification mode (audit / permissive / strict).
  string presentation_json = 6;
}

// Published by Counterparty Gateway → consumed by Payment Gateway
// Topic: {namespace}.auth_response
// Key: payment_id (for correlation with blocked HTTP request)
//
// Uses oneof to distinguish between:
// - PSP authorization decision (authorized/declined) — forwarded as raw JSON
// - CG-originated error (not found, timeout, webhook failure) — AtumError JSON
message AuthorizationResultEnvelope {
  string payment_id = 1;                       // Correlation key (matches request)
  string counterparty_did = 2;                 // Beneficiary PSP's DID

  reserved 4;                                  // formerly AuthorizationError error

  oneof result {
    string authorization_response_json = 3;    // Success: PSP's AuthorizationResponse JSON
    // Failure: CG-originated error as AtumError JSON (schemas/apis/error/v1),
    // catalog-coded — the single error taxonomy shared with the settlement
    // path's FulfillmentResultEnvelope.error_json.
    string error_json = 7;
  }

  google.protobuf.Timestamp timestamp = 5;

  // Holder-signed AuthorizationResponseEnvelope (ARE) — the beneficiary PSP's
  // W3C VerifiablePresentation wrapping its issuer-signed credentials, with a
  // proof.challenge bound to the inner AuthorizationResponse's content hash.
  // Response-side mirror of AuthorizationRequestEnvelope.presentation_json
  // (the PRE on the request side). Set ONLY alongside
  // authorization_response_json (the success case); empty for the error case
  // and when a beneficiary PSP does not emit an ARE (the payment gateway's response
  // perimeter dispatches empty-presentation per its audit/permissive/strict
  // mode, exactly like the request-side perimeter). Raw JSON-LD string to
  // preserve the holder signature.
  string presentation_json = 6;
}
