# Shapes this declaration shares with the others are generated from
# declarations/common/shapes/v1/schema.json rather than written here, so a producer and a
# verifier reading different declarations cannot end up with different ideas of what a
# credential, a proof or a signed message looks like.
#
# Where this declaration restricts a shared shape further, or names the specific value a
# field binds to, that is listed under `overlay` with the reason. Everything else comes
# from the shared definition unchanged.
#
# To change one of these, edit the shared source and run:
#
#     make -C schemas generate-canonical-shapes

target: schema.json
source: ../../common/shapes/v1/schema.json

shapes:
  - name: VerifiableCredential
    from: $defs/VerifiableCredential
  - name: VPDataIntegrityProof
    from: $defs/VPDataIntegrityProof
    reason: |
      Names the value this envelope's challenge binds to and the service identifier its
      domain must equal. Both are specific to this envelope; the shared definition states
      only the rule.
    overlay:
      properties:
        challenge:
          description: "Replay-binding challenge. The verifier requires this to equal request_hash \u2014 the content hash of the inner PaymentRequest \u2014 recomputed from the received request; mismatch indicates either a stale PRE from a different request or a forged envelope. request_hash includes request_id (the idempotency key) so distinct requests get distinct challenges; binding to the content hash rather than payment_id re-anchors replay protection to a real protocol-level identity."
        domain:
          description: "Replay-binding domain. The verifier requires this to equal its configured service identifier \u2014 locked to a NETWORK-WIDE value `did:web:<env>.atum.network` (e.g., `did:web:atum.network`). Distinct from FQE's `did:web:settler.<env>.atum.network` so a captured PRE can't be misrouted to FQE-shaped verifiers. Without this, a captured PRE from one environment could be replayed against another by the same originator."
