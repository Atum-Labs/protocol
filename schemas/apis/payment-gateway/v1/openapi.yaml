          type: object
          description: |-
            The verification service that confirms the payment was delivered before the escrow
            releases the source funds, and the account it signs with. Required on every chain:
            the gateway's `/v1/defaults` response supplies it for each chain.
          required:
            - account
            - endpoint
          properties:
            account:
              type: string
              description: The wallet address or public key of the verification service
              example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
            endpoint:
              type: string
              format: uri
              description: |-
                Origin of the fulfillment verifier service, with no path — the caller
                appends the verifier's own API paths. The gateway's `/v1/defaults` response
                supplies the default fulfillment verifier for each chain.
              example: https://veri-fill.production-testnet.atum.xyz
        escrow_contract_address:
          type: string
          description: Escrow contract on the source chain that holds the source funds until proof of fulfillment has been verified. Required on every chain. Take the value for the source chain from the payment gateway's GET /v1/defaults (`escrow_contract`).
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        fulfillment_proxy:
          type: string
          description: |-
            Fulfillment Proxy contract address, used to emit proof of fulfillment on the destination chain. Leave empty to use the default.
          example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
        settler_requirements:
          type: object
          description: Optional settler filtering requirements. If whitelist is present, only whitelisted settlers may win. If blacklist is present, blacklisted settlers are excluded. Both can be specified; blacklist takes precedence (a settler in both lists is rejected).
          properties:
            whitelist:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 100
              description: List of settler DIDs permitted to fulfill this request. If present and non-empty, only these settlers may win. Use W3C DID format (e.g., did:pkh:eip155:1:0xABC...).
              items:
                type: string
                pattern: ^did:[a-z][a-z0-9]*:[a-zA-Z0-9._:%-]+$
              example:
                - did:pkh:eip155:1:0x742D35cC6634c0532925a3b844Bc9e7595F41360
            blacklist:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 100
              description: List of settler DIDs excluded from fulfilling this request. If present and non-empty, these settlers are rejected. Use W3C DID format (e.g., did:pkh:eip155:1:0xABC...).
              items:
                type: string
                pattern: ^did:[a-z][a-z0-9]*:[a-zA-Z0-9._:%-]+$
              example:
                - did:pkh:eip155:1:0x892bb2E4F6b14a2B5b82bA8D33e5925d42d4432f

    FulfillmentAuthorization:
      description: |-
        Authorization for an originator to fulfill a payment request. The settler produces this declaration after authorizeFulfillment when the payment request's fulfill executor is "originator". A settler fulfill does not produce it.

        Canonical JSON Schema: schemas/declarations/FulfillmentAuthorization/v1/schema.json
        Published at https://schemas.atum.xyz/declarations/FulfillmentAuthorization/v1
      type: object
      additionalProperties: false
      required:
        - version
        - scheme
        - authorization
        - fulfillment_quote_json
        - evidence
      properties:
        version:
          type: string
          description: Semver-shaped declaration version (MAJOR.MINOR). The major component is locked to this schema's parent directory (v1 → major must be 1).
          pattern: ^1\.[0-9]+$
          example: "1.0"
        scheme:
          type: string
          description: 'Authorization scheme: EIP-3009 for an EVM destination, SOROBAN-AUTH for a Stellar one.'
          enum:
            - EIP-3009
            - SOROBAN-AUTH
        authorization:
          description: Signed authorization. For scheme EIP-3009, message_prehash is the EIP-712 TransferWithAuthorization typed data as a JSON string ({domain, types, primaryType, message}, with uint256 values as decimal strings), message is its EIP-712 digest, signature is the settler's 65-byte signature over that digest, and payload is absent. message.validBefore is the payment request's fulfillment_deadline in whole unix seconds, and message.nonce is the fulfillment quote hash. For scheme SOROBAN-AUTH the Soroban fulfillment proxy treats the authorization hash as 32 opaque bytes; the signed form is not defined here yet and the bindings do not validate this scheme.
          $ref: '#/components/schemas/SignedMessage'
        fulfillment_quote_json:
          type: string
          description: Raw JSON of the fulfillment quote (schemas/declarations/FulfillmentQuote/v1/schema.json), including proof metadata so its canonical quote hash can be computed.
        evidence:
          type: object
          description: Pointer to the on-chain evidence of the fulfillment authorization.
          additionalProperties: false
          required:
            - transaction_id
            - log_index
          properties:
            transaction_id:
              type: string
              minLength: 1
              description: Chain transaction identifier. EVM transactions are 0x-prefixed hex, Tron and Stellar transactions are hex without that prefix, and Solana transactions are base58.
            log_index:
              type: integer
              minimum: 0

    OwnedAsset:
      type: object
      description: Represents a cryptocurrency or token in a specific wallet. This tells the system what asset you're sending/receiving and which wallet to use.
      required:
        - asset_identifier
        - account
      properties:
        asset_identifier:
          type: string
          description: |-
            A unique identifier for the asset using CAIP-19 format.
            CAIP-19 is a standard way to identify blockchain assets: {chain_id}/{asset_namespace}:{asset_reference}
            Examples:
            - Ethereum USDC: "eip155:1/erc20:0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
            - Arbitrum USDC: "eip155:42161/erc20:0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
            - Solana USDC: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp/token:EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
            - Tron USDT: "tron:mainnet/trc20:TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
            - Stellar SEP-41 token: "stellar:pubnet/sep41:CCW67TSZV3SSS2HXMBQ5JFGCKJNXKZM7UQUWUZPUTHXSTZLEO7SJMI75" (`stellar:testnet` for the test network, and the reference is the token's C... contract id)
          pattern: ^[a-z0-9]+:[a-zA-Z0-9_-]+/[a-z0-9-]{3,8}:[-.%a-zA-Z0-9]{1,128}(/[-.%a-zA-Z0-9]{1,78})?$
          example: eip155:1/erc20:0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48
        account:
          type: string
          description: |-
            The wallet address that owns this asset.
            Format depends on the blockchain:
            - Ethereum/EVM: 0x-prefixed hex address (42 characters)
            - Solana: Base58 encoded address
            - Tron: T-prefixed Base58 address
            - Stellar: G... account or C... contract strkey

            A destination account is checked at ingress and must be payable on the chain named by
            its `asset_identifier`: it parses for that chain, carries a valid EIP-55 checksum when
            mixed-case, has no surrounding whitespace, and is not the zero address. A receiver that
            fails any of these is refused with `INVALID_DESTINATION_ACCOUNT`, before any funds move.
          minLength: 1
          maxLength: 128
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"

    SenderAuth:
      type: object
      description: Authorization from the asset owner to execute the payment. The exact format depends on the source blockchain's authorization mechanism.
      required:
        - message_scheme
        - signed_messages
      properties:
        verifiable_credential:
          $ref: '#/components/schemas/VerifiableCredentialAuth'
          deprecated: true
          description: 'DEPRECATED: inner-document credential carrier. Credentials MUST ride ONLY in the holder-signed PaymentRequestEnvelope (PRE); the inner PaymentRequest carries no credential and its Data Integrity signature EXCLUDES this field (stripped before canonicalization on both producer and verifier). Populated only for one back-compat rollout cycle, then removed.'
        message_scheme:
          $ref: '#/components/schemas/SenderAuthMessageScheme'
        signed_messages:
          type: array
          description: Array of signed messages (at least one required)
          minItems: 1
          items:
            $ref: '#/components/schemas/SignedMessage'

    SenderAuthMessageScheme:
      type: string
      description: |-
        The signature method used for authorizing this payment:
        - `EVM_PERMIT2`: Gasless token approvals for Ethereum/EVM chains
        - `EVM_PERMIT2_ESCROW`: Gasless approvals with escrow support
        - `SOLANA`: Standard Solana transaction signatures
        - `TRON`: Tron transaction signatures
        - `STELLAR`: Stellar transaction signatures
      enum:
        - EVM_PERMIT2
        - EVM_PERMIT2_ESCROW
        - SOLANA
        - TRON
        - STELLAR

    SignedMessage:
      type: object
      description: A message that has been cryptographically signed to prove authorization. The signature proves you control the wallet that's sending funds.
      required: [message, signature]
      properties:
        message:
          type: string
          description: The data that was signed, hex-encoded with a 0x prefix on every supported chain. For the deposit (signed_messages[0]) it is the 32-byte hash of message_prehash.
          example: "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
        message_prehash:
          type: string
          description: |-
            The original data that `message` is the hash of. Required on every entry of a payment
            request's `sender_auth.signed_messages`: the gateway reads the signed terms from it.
          example: '{"permit":{"token":"0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48","amount":"1000000"}}'
        signature:
          type: string
          description: The cryptographic signature proving you authorized this message. Hex-encoded with a 0x prefix on every supported chain. The signer's own public key is base58 on Solana, but the signature itself is not.
          example: "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab1c"
        payload:
          type: object
          description: Optional chain-specific payload containing additional signing context (e.g., delegate_signer for Solana). Preserved through the pipeline for downstream consumers.
          additionalProperties: true
          example:
            delegate_signer: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin

    VerifiableCredentialAuth:
      type: object
      description: |-
        Optional identity verification using cryptographic credentials.

        DEPRECATED. Credentials are moving to a holder-signed W3C VerifiablePresentation that
        travels alongside a request rather than inside it. That envelope is not part of this
        HTTP contract, so there is nothing here to move them to yet: treat this as a legacy
        carrier, and do not build a new integration on it.
      required:
        - verifiable_credential
        - verification_method_id
        - signature
      properties:
        verifiable_credential:
          $ref: '#/components/schemas/VerifiableCredential'
        verification_method_id:
          type: string
          description: Reference to verification method from the DID Document
        signature:
          type: string
          description: Cryptographic signature matching the verification method type

    VerifiableCredential:
      type: object
      description: W3C Verifiable Credential structure conforming to the W3C Verifiable Credentials Data Model v1.1
      required:
        - '@context'
        - id
        - type
        - issuer
        - issuanceDate
        - credentialSubject
        - proof
      properties:
        '@context':
          type: array
          description: JSON-LD context array, must include 'https://www.w3.org/2018/credentials/v1'
          items:
            type: string
          example:
            - https://www.w3.org/2018/credentials/v1
        id:
          type: string
          description: Unique identifier for this credential
        type:
          type: array
          description: Credential types, must include 'VerifiableCredential'
          items:
            type: string
          example:
            - VerifiableCredential
            - KYCVerifiedCredential
        issuer:
          oneOf:
            - type: string
            - type: object
          description: DID or issuer object of the credential issuer
        issuanceDate:
          type: string
          format: date-time
          description: When the credential was issued
        expirationDate:
          type: string
          format: date-time
          description: When the credential expires
        credentialSubject:
          type: object
          description: Claims about the credential subject (structure varies by issuer)
          additionalProperties: true
        credentialStatus:
          type: object
          description: Information for credential revocation checking. Not consulted by the verifier today.
          additionalProperties: true
        proof:
          type: object
          description: Cryptographic proof of credential integrity
          additionalProperties: true

    PaymentStatus:
      type: string
      description: |
        Where your payment is in its lifecycle. One payment reads the same however you ask
        about it.

        - `pending`: accepted and in progress. Nothing has reached the recipient yet.
        - `finalizing`: the transaction paying your recipient is on chain, but its chain has
          not yet judged it final. NOT FINAL, see below.
        - `completed`: delivered and final on the destination chain.
        - `failed`: did not complete. Any funds held in escrow are returned, and `error`
          describes what went wrong.
        - `refunding`: the settler will not deliver this payment and your funds are being
          returned from escrow. NOT FINAL: it becomes `refund_available` or `refunded`, and it
          can still become `completed` or `failed`.
        - `refund_available`: the settler did not deliver and the refund is authorized for you
          to submit. GET /v1/payments/{paymentId}/status returns `refund_signature`, which you
          submit to the source escrow to return your funds. The other responses report this
          status without the signature. NOT FINAL: the funds are still in escrow, so it becomes
          `refunded` once the refund lands, or `completed` if the settler delivers late and is
          paid first. Do not pay again while it is `refund_available`.
        - `refunded`: your funds were returned from the source escrow. `transactions.refund` is
          the refund transaction, when it is known.

        `completed`, `failed` and `refunded` are final and will not change afterwards.
        `pending`, `finalizing`, `refunding` and `refund_available` will.

        **Do not treat `finalizing` as delivered.** It says the payment has been made on
        chain but is not yet irreversible, much as a card authorization is not yet a
        settlement. It normally becomes `completed`, after seconds on some chains and minutes
        on others. If a chain reorganization drops the transaction before it is final, your
        funds are refunded instead. Acting on
        `finalizing` — releasing goods, crediting an account — means accepting that risk
        deliberately, at whatever threshold suits you rather than the one we wait for.

        `finalizing` is about paying the recipient. While your own funds are still being
        committed on the source chain the payment is `pending`, because nothing has reached
        the recipient yet.

      enum:
        - pending
        - finalizing
        - completed
        - failed
        - refunding
        - refund_available
        - refunded
      example: pending

    PaymentTransaction:
      type: object
      description: |
        One on-chain transaction belonging to a payment: which chain, which transaction, and
        which block it landed in.

        Whether the payment has actually happened is answered by `status`, not here. Read this
        to look the transaction up on chain and to verify it yourself.
      required:
        - transaction_hash
        - chain_id
      properties:
        transaction_hash:
          type: string
          description: |
            The transaction's hash on its chain. Hex hashes carry the `0x` prefix, including on
            Tron, whose own tooling omits it.
          pattern: "^(0x[a-fA-F0-9]{64}|[1-9A-HJ-NP-Za-km-z]{32,88})$"
          example: "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
        chain_id:
          type: string
          description: CAIP-2 identifier of the chain the transaction is on.
          pattern: "^[a-z0-9]+:[a-zA-Z0-9_-]+$"
          example: "eip155:42161"
        block_number:
          type: integer
          description: |
            The block the transaction landed in. Absent until it has been mined.

            Provisional while `status` is `finalizing`: a reorganization can still move the
            transaction to a different block. Settled once `status` is `completed` — keep it as
            a final record only from then.
          example: 61234567

    PaymentTransactions:
      type: object
      description: |
        The transactions a payment has produced, one entry per stage, added as each becomes
        known. A stage absent here has produced no transaction yet.

        These are the movements that decide whether your payment happened: your funds being
        committed, your recipient being paid, and your funds being returned when the payment
        is refunded. Present on every outcome, so a payment that did not complete can still be
        traced on chain.

        Where a stage is attempted more than once, the entry describes the attempt that
        counts — the one that succeeded, or the last one if none did.
      properties:
        deposit:
          allOf:
            - $ref: '#/components/schemas/PaymentTransaction'
          description: Committing your funds on the source chain.
        fulfillment:
          allOf:
            - $ref: '#/components/schemas/PaymentTransaction'
          description: Paying your recipient on the destination chain.
        refund:
          allOf:
            - $ref: '#/components/schemas/PaymentTransaction'
          description: |
            Returning your funds from the escrow on the source chain. Can be absent on a
            `refunded` payment when the refund transaction is not known.

    RefundSignature:
      type: object
      description: |
        The refund authorization for a `refund_available` payment, as the verifier signed it.
        Submit it to the source chain's escrow `refund` to return your funds yourself.

        Anyone holding it can submit the refund, but the escrow only ever pays the depositor. If
        the settler delivers late and is paid first, the refund no longer goes through.
        On Solana the submitter also receives the rent of the deposit account the refund closes.
      required:
        - signature
        - message_hash
        - message_prehash
      properties:
        signature:
          type: string
          description: |
            The verifier's signature over `message_hash`. Hex with the `0x` prefix on EVM and
            Tron chains, hex without it on Solana.
        message_hash:
          type: string
          description: The signed digest, hex without the `0x` prefix.
        message_prehash:
          type: string
          description: |
            The signed message as JSON. On EVM and Tron chains it carries the RefundWitness the
            escrow's `refund` takes.

    PaymentResponse:
      type: object
      description: |
        Response from submitting a payment request. If settlement completes inside the
        gateway's synchronous window, the response is `completed` and `transactions` carries
        both the deposit and the payout. The window also ends when the payment reaches `finalizing`,
        so the response normally carries the payout transaction (`transactions.fulfillment`)
        within seconds. Otherwise you receive a payment_id plus the payment's current
        `status`, and can poll /v1/payments/{paymentId}/status for updates.

        Read `status` before deciding what to do next: a `pending` or `finalizing` payment is
        in flight and must NOT be re-submitted under a new request_id (that would be a second
        payment), whereas a `failed` one is terminal — re-submitting it under the SAME
        request_id resolves to the same terminal payment, so a genuine re-attempt needs a
        new request_id.

        **A synchronously-completed payment carries proof of QUOTE as well as of delivery.** When
        settlement lands inside the window you get `status: completed`, the deposit and payout in
        `transactions`, and — since a quote necessarily was awarded to get there —
        `quote_id` and `fulfillment_quote`. The fast path therefore needs no follow-up call to
        verify: recompute `quote_hash` over the returned quote and compare it against the on-chain
        commitment from this response alone.

        `status` is present on every response. `completed` is always accompanied by
        `transactions.deposit` and `transactions.fulfillment`: either one missing from a
        `completed` payment is a gateway fault, to report with the `payment_id`. `failed` is
        accompanied by `error` where a reason has been recorded.
      required:
        - payment_id
        - status
        - idempotent_replay
      properties:
        payment_id:
          type: string
          description: |
            Unique ID for tracking this payment. Save this to check status later.
          example: "0x761989729fefb4b0cb8b3e6f787301a3878c91e8fba35ed362a079292879f34f"
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactions:
          $ref: '#/components/schemas/PaymentTransactions'
        idempotent_replay:
          type: boolean
          description: |
            Whether this response describes a payment that already existed, rather than one
            created by this request. `true` means the request_id had been used before and you
            are being handed the ORIGINAL payment — no second payment was created and nothing
            additional was charged.

            **Re-attempting a payment.** Re-submit the same request and you get the same payment
            back. You may re-send the original bytes unchanged: the deadlines will have expired by
            then — `quote_deadline` bounds the auction and is short, while this endpoint may hold a
            submission for up to 30 seconds — and an expired deadline on a re-submission is not an
            error, because the request is resolved onto the payment that already exists rather than
            used to create one.

            Re-signing with fresh deadlines is equally fine and returns the same payment. What you
            must NOT change is the request_id, and what you must not change under it is the
            payment's economics — source, destination, fulfillment_amount, max_source_amount — which
            are rejected with 409 IDEMPOTENCY_TERMS_MISMATCH. Deadlines and the signature are
            exempt precisely so that a re-attempt is possible.

            A direct deposit, one you fund yourself before you submit, is the exception: re-send
            the bytes you funded, because the deposit commits the request. A re-submission that
            moved only its deadlines is normally still handed the payment that holds this
            `request_id`.
            Check that its `payment_id` is the id of the deposit you funded, from your deposit
            transaction rather than from a request you built again. If it is not, take your
            deposit back with `refundUnreserved` and start again under a new `request_id` and
            deposit nonce.

            A genuinely new payment needs a NEW request_id. In particular a `failed` payment is
            terminal: re-submitting its request_id keeps returning that dead payment, so recovering
            means starting a new one under a new key.

            Present on every response, `false` for a newly created payment. A response without
            the field is from a gateway predating it, not a newly created payment.

            This is the field to read when reconciling a suspected double charge: two
            submissions where the second reports `true` are one payment, whereas two both
            reporting `false` are two. It says nothing about how far the payment has got —
            read `status` for that.
          example: false
        quote_id:
          type: string
          description: |
            The winning quote's ID. Present when `status` is `completed` — a payment cannot settle
            without an award — and absent on a `pending` response, where no quote has been selected
            yet. Same value and meaning as on GET /v1/payments/{paymentId}/status.
          example: "0x9a3b...e8d4"
        fulfillment_quote:
          type: object
          description: |
            The settler-signed FulfillmentQuote for the winning quote, returned verbatim as an
            opaque signed document — the PREIMAGE of the `quote_hash` committed on-chain. Same
            value, semantics and canonicalization caveats as on
            GET /v1/payments/{paymentId}/status; see that field for how to verify it.

            Present when `status` is `completed`. It may be absent even then, if the stored quote
            is unreadable: the award is reported through `quote_id` regardless, so a present
            `quote_id` with no `fulfillment_quote` means "verification preimage unavailable" and
            never "no quote was awarded". A consumer that requires the preimage should fall back to
            the status endpoint rather than treat the payment as unverified.
          x-go-type: json.RawMessage
        fulfillment_authorization:
          type: object
          description: |
            The settler-signed FulfillmentAuthorization for this payment, returned verbatim as an
            opaque signed document (structurally the canonical FulfillmentAuthorization/v1 declaration at
            https://schemas.atum.xyz/declarations/FulfillmentAuthorization/v1; see also
            `#/components/schemas/FulfillmentAuthorization`). The inner declaration requires
            `version`, `scheme`, `authorization` (the signed EIP-3009 transfer, in `authorization.message_prehash`), `fulfillment_quote_json`,
            and `evidence` (the on-chain authorizeFulfillment transaction). On the wire the settler
            typically wraps that declaration in JSON-LD with `@context`, `type`, and `proof` — those
            envelope fields ride alongside the declaration and MUST be preserved byte-for-byte.

            Present when the settler authorized an originator fulfill. Until the originator
            fulfills, `transactions.fulfillment` is absent.

            The service returns these bytes verbatim and does not re-serialize through a typed
            representation (which would normalize timestamps and reorder JSON-LD envelope fields).
          x-go-type: json.RawMessage
        error:
          $ref: '#/components/schemas/PaymentFailure'
        refund_reason:
          allOf:
            - $ref: '#/components/schemas/PaymentFailure'
          description: |
            Why the settler did not deliver, as it reported when it gave up. Present only when
            `status` is `refunding`, `refund_available` or `refunded`, and absent when the refund
            started without a reason from the settler. `status` decides what to do next: its
            `retry_classification` and `request_id_reusable` describe the settler's error, not
            this payment, and never mean paying again while it is `refunding` or `refund_available`.
        requested_count:
          type: integer
          description: |
            How many settler agents this payment's auction was broadcast to. Accompanies
            `decline_summary` and is present under the same condition. Same meaning and same
            absence rule as on GET /v1/payments/{paymentId}/status: absent means unknown, never
            zero.
          example: 8
        decline_summary:
          type: array
          description: |
            Why the payment drew few or no quotes, carried on the submission response so that a
            `failed` payment explains itself here rather than requiring a follow-up read. A
            payment that ran out its quote deadline reports `NO_QUOTES_RECEIVED` on `error`;
            this is what the settlers actually said.

            Present when `status` is `failed`, alongside `error`. A submission rejected before
            its auction opened is answered as an error response rather than this type and carries
            no breakdown, and GET /v1/payments/{paymentId}/status reports the breakdown in every
            state.

            Same counting rules as GET /v1/payments/{paymentId}/status: every declining agent is
            counted exactly once under its most recent reason, empty means no agent declined,
            absent means the breakdown could not be read. The free-form decline detail is never
            relayed.
          items:
            $ref: '#/components/schemas/DeclineSummaryEntry'

    GetPaymentStatusResponse:
      type: object
      properties:
        payment_id:
          type: string
          description: |
            The payment ID you're checking status for.
          example: "0x761989729fefb4b0cb8b3e6f787301a3878c91e8fba35ed362a079292879f34f"
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactions:
          $ref: '#/components/schemas/PaymentTransactions'
        updated_at:
          type: string
          format: date-time
          description: When the status was last updated
        quote_id:
          type: string
          description: |
            The winning quote's ID. Present once a quote has been awarded for this payment;
            absent while the payment is still collecting or awarding. Cross-references the
            `quote_id` returned by GET /v1/payments/quote-requests/{quoteRequestId}.
          example: "0x9a3b...e8d4"
        fulfillment_quote:
          type: object
          description: |
            The settler-signed FulfillmentQuote for the winning quote, returned verbatim as an
            opaque signed document (structurally the canonical FulfillmentQuote/v1 declaration at
            https://schemas.atum.xyz/declarations/FulfillmentQuote/v1). Present once a quote has
            been awarded — including after the payment completes and `transactions.fulfillment` is
            populated, since that is precisely when a consumer verifies.

            This is the PREIMAGE of the `quote_hash` committed on-chain in the escrow deposit and
            reserve witnesses. On-chain we commit only the hash, so a quote-selector consumer
            recomputes quote_hash over these bytes and compares it against the on-chain commitment
            to confirm the payment settled against the quote it selected ("trust but verify"), and
            verifies the settler signature over the same bytes.

            quote_hash is canonicalization-based (URDNA2015), so it is stable across JSON
            key-order/whitespace normalization and across JSON string-escaping differences. The
            returned bytes are hash-equivalent to, but not necessarily byte-identical with, what
            the settler emitted (quotes are stored as JSONB, which normalizes on write). The
            gateway still never re-serializes the quote through a typed struct (that renormalizes
            timestamp values and WOULD change quote_hash), so the Go binding exposes it as a raw
            JSON passthrough.
          x-go-type: json.RawMessage
        fulfillment_authorization:
          type: object
          description: |
            The settler-signed FulfillmentAuthorization for this payment, returned verbatim as an
            opaque signed document (structurally the canonical FulfillmentAuthorization/v1 declaration at
            https://schemas.atum.xyz/declarations/FulfillmentAuthorization/v1; see also
            `#/components/schemas/FulfillmentAuthorization`). The inner declaration requires
            `version`, `scheme`, `authorization` (the signed EIP-3009 transfer, in `authorization.message_prehash`), `fulfillment_quote_json`,
            and `evidence` (the on-chain authorizeFulfillment transaction). On the wire the settler
            typically wraps that declaration in JSON-LD with `@context`, `type`, and `proof` — those
            envelope fields ride alongside the declaration and MUST be preserved byte-for-byte.

            Present when the settler authorized an originator fulfill. Until the originator
            fulfills, `transactions.fulfillment` is absent.

            The service returns these bytes verbatim and does not re-serialize through a typed
            representation (which would normalize timestamps and reorder JSON-LD envelope fields).
          x-go-type: json.RawMessage
        error:
          $ref: '#/components/schemas/PaymentFailure'
        refund_reason:
          allOf:
            - $ref: '#/components/schemas/PaymentFailure'
          description: |
            Why the settler did not deliver, as it reported when it gave up. Present only when
            `status` is `refunding`, `refund_available` or `refunded`, and absent when the refund
            started without a reason from the settler. `status` decides what to do next: its
            `retry_classification` and `request_id_reusable` describe the settler's error, not
            this payment, and never mean paying again while it is `refunding` or `refund_available`.
        refund_signature:
          allOf:
            - $ref: '#/components/schemas/RefundSignature'
          description: Present only when `status` is `refund_available`.
        requested_count:
          type: integer
          description: |
            How many settler agents this payment's auction was broadcast to. Absent means
            unknown, never zero.
          example: 8
        decline_summary:
          type: array
          description: |
            Why the payment drew few or no quotes. Read from the same settler reports as the
            quote-request endpoints, keyed by this payment, so a payment that failed on an expired
            quote deadline can say WHY nobody funded it instead of only that nobody did.

            Every declining agent is counted exactly once under its most recent reason. Empty means
            no agent declined against this payment, absent means the breakdown could not be read. A
            payment awarded out of a quote-request batch was bid on at quote time, so its declines
            are keyed to that batch and are read from the batch's status endpoint rather than here.
            As on the quote-request endpoints, the free-form decline detail is never relayed.
          items:
            $ref: '#/components/schemas/DeclineSummaryEntry'

    PaymentFailure:
      type: object
      description: |
        Why a payment failed, why its settler gave up, or why a quote request has no quotes. On a
        payment, as `error` it is present only when `status` is `failed`, as `refund_reason` only
        on the refund statuses, and it is identical however you ask about the payment. On a quote
        request, as `error` it is present only in the cases that field describes.

        `code` is the stable, machine-readable identity of the failure — branch on it
        rather than on `message`, which is written for a person and may be reworded.
        `docs_url` points at the page describing that code.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Public error category in SCREAMING_SNAKE_CASE. Common codes:
            - `SETTLEMENT_FAILED`: the settlement could not be completed
            - `NO_QUOTES_RECEIVED`: no quotes arrived within the auction window
            - `QUOTES_EXPIRED`: quotes arrived but none could be selected
            - `NO_SETTLER_FOR_CORRIDOR`: no settler serves this source and destination pair
            - `SERVICE_BUSY`: no capacity was available to start an auction
            - `INSUFFICIENT_FUNDS`: the paying account held too little of the source token to fund the deposit
            - `MISSING_TOKEN_APPROVAL`: the paying account had not approved Permit2 for enough of the source token
            - `INTERNAL_ERROR`: an unexpected error occurred

            On a payment, an auction that closes without a usable quote fails it here, under
            `status` `failed`, never as an HTTP error on `POST /v1/payments`. These outcomes
            are terminal for the `request_id`, so a genuine re-attempt needs a new one.
          example: "SETTLEMENT_FAILED"
        message:
          type: string
          description: |
            Human-readable description of the failure, for a person reading it. Do not
            branch on this text.
          example: "No quotes received within the auction window"
        domain:
          type: string
          description: |
            Which part of the system reported the failure.
          enum:
            - PAYMENT_GATEWAY
            - SETTLER_GATEWAY
            - SETTLER_AGENT
            - WALLET_ORCHESTRATION
            - VERIFICATION_SERVICE
            - BLOCKCHAIN
            - EXTERNAL_SERVICE
          example: "PAYMENT_GATEWAY"
        docs_url:
          type: string
          format: uri
          description: Link to the documentation page for this public code.
        retry_classification:
          type: string
          description: >-
            What the caller should do next. Absent means the condition has not been
            classified, which is not the same as safe to retry.

            Re-sending the same `request_id` is an idempotent replay and always safe.
            This value is about submitting a new one, which starts a new payment or quote
            request. See https://docs.atum.xyz/errors for the value set.
          example: "RECONCILE_THEN_DECIDE"
        request_id_reusable:
          type: boolean
          description: >-
            Whether the caller may re-send the `request_id` this payment or quote request
            was created under. On this shape it is almost always false, because the payment
            or quote request already exists, but it is carried rather than assumed so a
            caller reads the same field here as on a synchronous error. Absent means undetermined,
            which a caller should read as false.
          example: false
        blockchain_context:
          $ref: '#/components/schemas/PaymentBlockchainContext'

    PaymentBlockchainContext:
      type: object
      description: |-
        Where on chain a failed payment failed. Present only when the failure happened
        on chain — an escrow revert, or a fulfillment that could not be delivered — so a
        payment that failed before any transaction was sent carries no context here.
      properties:
        chain_id:
          type: string
          description: CAIP-2 chain identifier
          pattern: ^[a-z0-9]+:[a-zA-Z0-9_-]+$
        transaction_hash:
          type: string
          description: Failed transaction hash
          pattern: ^(0x[a-fA-F0-9]{64}|[1-9A-HJ-NP-Za-km-z]{32,88})$
        block_number:
          type: integer
          description: Block number where error occurred
        contract_address:
          type: string
          description: Contract that caused the error
          pattern: ^(0x[a-fA-F0-9]{40}|[1-9A-HJ-NP-Za-km-z]{32,44}|[GC][A-Z2-7]{55})$
        revert_reason:
          type: string
          description: Smart contract revert reason
        gas_used:
          type: string
          description: Gas consumed before failure
        estimated_gas_needed:
          type: string
          description: Estimated gas needed for success
      x-go-type: atumerror.BlockchainContext
      x-go-type-import:
        name: atumerror
        path: github.com/atum-labs/protocol/schemas/apis/error/v1/bindings/go

    PreparePaymentRequest:
      type: object
      description: |
        Human-readable payment request parameters for generating an unsigned PaymentRequest.
        Asset identifiers use a CAIP-19-like format with "/" separator and support friendly names.
      required:
        - request_id
        - source_asset
        - source_account
        - destination_asset
        - destination_account
      properties:
        request_id:
          type: string
          description: |
            Unique identifier for tracking this payment request.
            Used for idempotency and matching responses to requests.
          example: "req_123456789"
        source_asset:
          type: string
          description: |
            Source asset in human-readable CAIP-19-like format: {chain}/{asset}
            Supports both friendly names and full CAIP-19 identifiers:
            - "ethereum/usdc" (friendly names)
            - "eip155:1/erc20:0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" (full CAIP-19)
          example: "ethereum/usdc"
        source_account:
          type: string
          description: Wallet address that will send the payment
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        destination_asset:
          type: string
          description: |
            Destination asset in human-readable CAIP-19-like format: {chain}/{asset}
            Supports both friendly names and full CAIP-19 identifiers:
            - "arbitrum/usdc"
            - "eip155:42161/erc20:0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
          example: "arbitrum/usdc"
        destination_account:
          type: string
          description: Wallet address that will receive the payment
          example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
        amount:
          type: string
          description: |
            Simple amount specification in decimal format (e.g., "1.50" for $1.50 USDC).
            Use this OR specify both max_source_amount and fulfillment_amount.
            Cannot be used together with max_source_amount/fulfillment_amount.
          example: "1.50"
        max_source_amount:
          type: string
          description: |
            Maximum amount willing to spend from source (in decimal format).
            Must be specified together with fulfillment_amount.
            Cannot be used together with amount field.
          example: "1.60"
        fulfillment_amount:
          type: string
          description: |
            Exact amount to be fulfilled at destination (in decimal format).
            Must be specified together with max_source_amount.
            Cannot be used together with amount field.
          example: "1.50"
        quote_deadline_seconds:
          type: integer
          description: |
            Seconds until quote deadline (from now).
            How long to wait for settlement provider quotes. A settler that must source the
            payout first, such as through a swap, may need longer than the default and declines
            a window too short for that work with QUOTE_WINDOW_TOO_SHORT. Once the payment has
            failed, reissue it with a larger value. See quote_deadline.
          default: 3
          example: 3
        fulfillment_deadline_seconds:
          type: integer
          description: |
            Seconds until the fulfillment deadline (from now): the time by which the payout to the
            recipient must be mined on the destination chain. It does not have to be final by then.
            A failed payment is refunded only after this deadline, so a shorter one gives the
            payer's funds back sooner. The default fits every supported source chain for everyday
            payment sizes. For a large payment a settler may wait until the source chain finalizes
            the deposit and does not bid on a deadline that wait does not fit, so pass a longer
            value, for example 3600.
          default: 300
          example: 300

    PreparePaymentResponse:
      type: object
      description: |
        Complete unsigned PaymentRequest ready for signing.
        Contains all resolved technical details and typed data ready for signing.
      required:
        - payment_request
      properties:
        payment_request:
          $ref: '#/components/schemas/PaymentRequest'
          description: |
            Complete PaymentRequest with signature field set to null.
            Client should fill in the signature field(s) in
            sender_auth.signed_messages, either by signing the message_hash
            field in signed_messages or by using typed data signing on the
            message_prehash field in signed messages, and then submit the full
            object to POST /v1/payments.

    ResolvePaymentResponse:
      type: object
      required:
        - payment_id
      properties:
        payment_id:
          type: string
          description: The payment ID that corresponds to the given request ID
          example: "0x8b73c3c69bb8fe3d512ecc4cf759cc79239f7b179b0ffacaa9a75d522b39400f"

    PaymentTimelineResponse:
      type: object
      description: |
        Step-by-step view of a payment's settlement lifecycle. Includes a route
        summary, a list of steps with timings, and if the payment failed, a
        structured error describing where and why.
      required:
        - payment_id
        - status
        - created_at
        - updated_at
        - steps
      properties:
        payment_id:
          type: string
          example: "0x8b73c3c69bb8fe3d512ecc4cf759cc79239f7b179b0ffacaa9a75d522b39400f"
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactions:
          $ref: '#/components/schemas/PaymentTransactions'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        total_duration_ms:
          type: integer
          format: int64
          description: Total time from first step to last completed step (only set for terminal states)
        summary:
          $ref: '#/components/schemas/PaymentSummary'
        error:
          $ref: '#/components/schemas/PaymentFailure'
        refund_reason:
          allOf:
            - $ref: '#/components/schemas/PaymentFailure'
          description: |
            Why the settler did not deliver, as it reported when it gave up. Present only when
            `status` is `refunding`, `refund_available` or `refunded`, and absent when the refund
            started without a reason from the settler. `status` decides what to do next: its
            `retry_classification` and `request_id_reusable` describe the settler's error, not
            this payment, and never mean paying again while it is `refunding` or `refund_available`.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TimelineStep'

    PaymentSummary:
      type: object
      description: Top-level context about the payment (parties, assets, amounts)
      properties:
        source_asset:
          type: string
          description: CAIP-19 identifier of the source asset
          example: "eip155:1/erc20:0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        source_account:
          type: string
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        dest_asset:
          type: string
          example: "eip155:42161/erc20:0xaf88d065e77c8cC2239327C5EDb3A432268e5831"
        dest_account:
          type: string
          example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
        fulfillment_amount:
          type: string
          description: Raw fulfillment amount in smallest token units
          example: "1000000"
        display_amount:
          type: string
          description: |
            `fulfillment_amount` formatted in the destination asset with its symbol, e.g. "1.00 USDC".
            Only set when the destination asset is one Atum supports; absent otherwise, so use `fulfillment_amount`.
          example: "1.00 USDC"
        max_source_amount:
          type: string
          description: Raw max source amount in smallest token units
          example: "1005000"
        display_max_source_amount:
          type: string
          description: |
            `max_source_amount` formatted in the source asset with its symbol, e.g. "1.005 USDC".
            Only set when the source asset is one Atum supports; absent otherwise, so use `max_source_amount`.
          example: "1.005 USDC"
        request_id:
          type: string
          example: "req_123456789"

    TimelineStep:
      type: object
      required:
        - name
        - label
        - status
      properties:
        name:
          type: string
          description: Internal name of the step (matches settlement event type)
          example: "BID_AWARDED"
        label:
          type: string
          description: Human-readable label
          example: "Best Bid Selected"
        status:
          type: string
          enum: [completed, in_progress, pending, failed, skipped]
          description: |
            Current status of this step:
            - `completed`: Step finished successfully
            - `in_progress`: Step currently executing
            - `pending`: Step hasn't started yet
            - `failed`: Step errored out
            - `skipped`: Step will never execute because an earlier step failed
        timestamp:
          type: string
          format: date-time
          description: When the step completed (if it has)
        duration_ms:
          type: integer
          format: int64
          description: Time this step took, measured from the previous step
        chain_id:
          type: string
          description: CAIP-2 chain this step happened on (if on-chain)
          example: "eip155:1"
        transaction_hash:
          type: string
          description: Transaction hash associated with this step (if on-chain)
        details:
          type: object
          description: Additional step-specific data (e.g. block_number, settler, reason)
          additionalProperties: true

    ErrorResponse:
      type: object
      description: >-
        Safe, outward-facing error. Derived from an internal error through the
        shared error catalog. The public code identifies the category and the
        message is a curated, safe description.


        A panic is caught by shared middleware that responds
        `{"error": "Internal server error occurred"}` instead, so a 500 is not
        guaranteed to carry this shape.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Public, machine-readable error category in SCREAMING_SNAKE_CASE.
          pattern: "^[A-Z][A-Z0-9_]*$"
          example: "INVALID_SOURCE_ASSET"
        message:
          type: string
          description: Curated, safe, human-readable message.
          maxLength: 500
          example: "The source asset identifier is not a valid CAIP-19 asset."
        request_id:
          type: string
          description: Correlation id to quote to support to locate the internal error record.
          example: "req_123456789"
        payment_id:
          type: string
          description: >-
            The payment this error was raised against. Absent when the error is not
            about a specific payment.
          example: "0xc7108e200d11580e7e75185991084b42a535af588ba8267cd0d1e7df089e5c9c"
        docs_url:
          type: string
          format: uri
          description: Link to the documentation page for this public code.
        domain:
          type: string
          description: Originating service domain.
          example: "PAYMENT_GATEWAY"
        retry_classification:
          type: string
          description: >-
            What the caller should do next. Absent means the condition has not been
            classified, which is not the same as safe to retry.

            Re-sending the same `request_id` is an idempotent replay and always safe.
            This value is about submitting a new one, which starts a new operation. See
            https://docs.atum.xyz/errors for the value set.
          example: "RECONCILE_THEN_DECIDE"
        request_id_reusable:
          type: boolean
          description: >-
            Whether the caller may re-send this same request_id. True means no payment
            was created for it, so the id is still free. False means a payment exists
            for it, so the id is spent and re-sending only replays this outcome. Absent
            means undetermined, which a caller should read as false. Separate from
            retry_classification, which answers what the caller must change rather than
            whether the id survived.
          example: false
    CreateQuoteRequest:
      type: object
      description: |
        Request body for opening a quote-request batch. Structurally the existing PaymentRequest
        with `sender_auth` omitted (the spend authorization is deferred to the award call); see
        schemas/declarations/PaymentRequest/v1/schema.json.
      required:
        - version
        - request_id
        - source
        - destination
        - fulfillment_amount
        - quote_deadline
        - fulfillment_deadline
        - fulfillment_verifier
        - escrow_contract_address
      properties:
        version:
          type: string
          description: |
            Semver-shaped declaration version (MAJOR.MINOR), locked to major 1 for v1. Producers emit
            the canonical value exported by the bindings' Version constant.
          pattern: '^1\.[0-9]+$'
          example: "1.0"
        request_id:
          type: string
          description: |
            Client-supplied idempotency key for this quote-request. The same request_id from the
            same originator returns the same quote_request_id. Independent of the award-call request_id.
          example: "qr-2026-04-29-001"
        source:
          $ref: '#/components/schemas/OwnedAsset'
        destination:
          type: array
          description: |
            Array of destination assets for the settlement agent to choose from (at least one required, at most 16).
            The ceiling bounds the fan-out one request can buy: every consumer iterates this list.
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OwnedAsset'
        fulfillment_amount:
          type: string
          description: The exact amount to be received at the destination (smallest unit, e.g. wei or cents).
          minLength: 1
          pattern: ^[0-9]+$
          example: "100000000"
        max_source_amount:
          type: string
          description: |
            Optional cap on what the originator is willing to spend from source (smallest unit).
            Quotes with source_amount above this are filtered. No cap applied if omitted; an empty
            string is refused.
          minLength: 1
          pattern: ^[0-9]+$
          example: "101000000"
        quote_deadline:
          type: string
          format: date-time
          description: |
            Required. End of the collection window. After this point no new quotes are accepted.
            The gateway injects no default and never mutates the originator-supplied body, so the
            value is carried through verbatim to the award call. It must be supplied and must be in
            the future. Must be strictly earlier than fulfillment_deadline.

            Keep this window short. A settler holds its quoted price for a limited period of its
            own choosing, counted from when it receives the request, and declines a request whose
            window ends after that hold with QUOTE_WINDOW_TOO_LONG. Each quote can be awarded as
            soon as it is listed, so waiting for the window to close only takes time from the
            award.

            Do not make it too short either. A settler that has work to do before it can quote,
            such as sourcing the payout asset through a swap, and cannot finish it by this deadline
            declines with QUOTE_WINDOW_TOO_SHORT. Reissue with a longer quote_deadline. That work
            time varies by settler, so there is no fixed minimum. A settler waiting on another
            service cannot tell slow from down, so if the longer window is declined with a reason
            whose retry_classification is not NOT_RETRYABLE_FIX_REQUEST, the cause is on the
            settler's side, not in your request. Both bounds are counted from when a settler
            receives the request.
          example: "2026-04-29T12:00:03Z"
        fulfillment_deadline:
          type: string
          format: date-time
          description: |
            Required. The time by which the payout to the recipient must be mined on the
            destination chain. If no payout is mined by then, your escrowed funds are refunded.
            The payout does not have to be final by then: `completed`
            follows once the destination chain judges it final. The gateway injects no default and
            never mutates the originator-supplied body, so the value is carried through verbatim to
            the award call. It must be supplied and must be in the future. Must be strictly later
            than quote_deadline.
          example: "2026-04-29T12:30:00Z"
        settler_auth_required:
          type: object
          description: Policy requirements for settler authentication. Keys are policy names, values indicate if required.
          additionalProperties:
            type: boolean
        originator_auth:
          $ref: '#/components/schemas/VerifiableCredentialAuth'
        quote_selector:
          type: string
          description: |
            The account that picks the settler at award: the award's `sender_auth` names it as
            the `reserver`, and it signs the award's `reserve_auth`. Name it on every quote
            request: `source.account` to have its owner pick, the usual case. A payment service
            provider paying for a customer names its own address, so the customer signs only
            `sender_auth`.

            It must be able to sign `reserve_auth`: on Solana a key account, not a program-owned
            address such as a multisig vault; on EVM and Tron a key account or a contract that
            supports ERC-1271. Any such address may be named except the gateway's own selector
            (`quote_selector` in GET /v1/defaults), which signs no award and is refused with
            `400` `QUOTE_SELECTOR_NOT_ALLOWED`.
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        fulfillment_verifier:
          type: object
          description: |
            The verification service that confirms the payment was delivered before the escrow
            releases the source funds, and the account it signs with. Required on every chain:
            the gateway's `/v1/defaults` response supplies it for each chain.
          required:
            - account
            - endpoint
          properties:
            account:
              type: string
              description: The wallet address or public key of the verification service
              example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
            endpoint:
              type: string
              format: uri
              description: |
                Origin of the fulfillment verifier service, with no path — the caller
                appends the verifier's own API paths. The gateway's `/v1/defaults` response
                supplies the default fulfillment verifier for each chain.
              example: "https://veri-fill.production-testnet.atum.xyz"
        escrow_contract_address:
          type: string
          description: |
            Escrow contract on the source chain that holds the source funds until proof of
            fulfillment has been verified. Required on every chain: the gateway's `/v1/defaults`
            response supplies it for each chain (`escrow_contract`).
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        fulfillment_proxy:
          type: string
          description: Optional fulfillment-proxy contract address on the destination chain. Leave empty to use the default.
          example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
        settler_requirements:
          type: object
          description: |
            Optional settler filtering. If whitelist is present, only whitelisted settlers may win.
            If blacklist is present, blacklisted settlers are excluded. Both can be specified;
            blacklist takes precedence (a settler in both is rejected).
          properties:
            whitelist:
              type: array
              description: Settler DIDs permitted to fulfill this request (W3C DID format). If present, only these may win.
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                pattern: "^did:[a-z][a-z0-9]*:[a-zA-Z0-9._:%-]+$"
              example:
                - "did:pkh:eip155:1:0x742D35cC6634c0532925a3b844Bc9e7595F41360"
            blacklist:
              type: array
              description: Settler DIDs excluded from fulfilling this request (W3C DID format).
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                type: string
                pattern: "^did:[a-z][a-z0-9]*:[a-zA-Z0-9._:%-]+$"
              example:
                - "did:pkh:eip155:1:0x892bb2E4F6b14a2B5b82bA8D33e5925d42d4432f"
        "@context":
          type: array
          description: |
            Optional JSON-LD context URLs — present when the originator wraps the request in a W3C
            Data Integrity envelope so a downstream verifier can recover the signer identity.
          items:
            type: string
        proof:
          $ref: '#/components/schemas/DataIntegrityProof'
        verifiableCredential:
          type: array
          description: Optional document-level W3C Verifiable Credentials (e.g. KnownToAtum about the request producer).
          items:
            $ref: '#/components/schemas/VerifiableCredential'

    DataIntegrityProof:
      type: object
      description: W3C Data Integrity proof conforming to the Data Integrity 1.0 specification. Which of jws or proofValue is required depends on the cryptosuite named in type, and that pairing is checked where the proof is verified rather than by this schema, so a document can satisfy the schema and still be refused at verification.
      required:
        - type
        - created
        - verificationMethod
        - proofPurpose
      properties:
        type:
          type: string
          description: Proof type identifier. ECDSA-secp256k1 (recoverable, EVM-compatible) for did:pkh:eip155:* signers; Ed25519 for did:pkh:solana:* and did:pkh:stellar:* signers.
          example: EcdsaSecp256k1RecoverySignature2020
        created:
          type: string
          format: date-time
          description: 'ISO 8601 timestamp when the proof was created. Canonicalize the value exactly as it appears in the raw JSON: parsing it into a date-time and re-serializing can change the spelling (Z versus +00:00), and a different spelling canonicalizes to different bytes, so the signature no longer verifies.'
          example: "2026-04-29T12:00:00Z"
        verificationMethod:
          type: string
          description: DID URL identifying the verification method, e.g., 'did:pkh:eip155:1:0x...#blockchainAccountId' for ECDSA or 'did:pkh:solana:<chain>:<addr>#SolanaMethod2021' for Ed25519 on Solana, or 'did:pkh:stellar:<network>:<G-account>#blockchainAccountId' for Ed25519 on Stellar.
          example: did:pkh:eip155:42161:0xabc...#blockchainAccountId
        proofPurpose:
          type: string
          description: Purpose of the proof (e.g., assertionMethod, authentication).
          example: assertionMethod
        jws:
          type: string
          description: Detached JWS signature in <base64url(header)>..<base64url(sig)> form, header {alg:ES256K-R, b64:false, crit:[b64]}. Required at runtime for EcdsaSecp256k1RecoverySignature2020.
        proofValue:
          type: string
          description: Multibase-encoded raw signature bytes. Required at runtime for Ed25519Signature2020; mutually exclusive with jws in practice.

    Quote:
      type: object
      description: One collected quote — the content-hash identifier plus the verbatim settler-signed FulfillmentQuote.
      required:
        - quote_id
        - fulfillment_quote
      properties:
        quote_id:
          type: string
          description: |
            The canonical content hash of the settler-signed quote, the same value the escrow
            commits on chain as the quote hash. Send it as `quote_id` to award this quote.
          example: "0x4e7f...c2a1"
        fulfillment_quote:
          type: object
          description: |
            The settler-signed FulfillmentQuote (structurally the canonical FulfillmentQuote/v1
            declaration at https://schemas.atum.xyz/declarations/FulfillmentQuote/v1), returned
            verbatim as an opaque signed document. A client recomputes quote_hash over the returned
            bytes and verifies the settler signature before awarding the quote. quote_hash is
            canonicalization-based (URDNA2015), so it is stable across JSON key-order/whitespace
            normalization. The
            returned bytes are hash-equivalent to, but not necessarily byte-identical with, what the
            settler emitted (quotes are stored as JSONB, which normalizes on write). The gateway
            still never re-serializes the quote through a typed struct (that renormalizes timestamp
            values and WOULD change quote_hash), so the Go binding exposes it as a raw JSON passthrough.
          x-go-type: json.RawMessage

    AwardedQuote:
      type: object
      description: A collected quote in the status response, annotated with its award linkage.
      required:
        - quote_id
        - fulfillment_quote
      properties:
        quote_id:
          type: string
          example: "0x9a3b...e8d4"
        fulfillment_quote:
          type: object
          description: |
            The settler-signed FulfillmentQuote (structurally the canonical FulfillmentQuote/v1
            declaration at https://schemas.atum.xyz/declarations/FulfillmentQuote/v1), returned
            verbatim as an opaque signed document. A client recomputes quote_hash over the returned
            bytes and verifies the settler signature before awarding the quote. quote_hash is
            canonicalization-based (URDNA2015), so it is stable across JSON key-order/whitespace
            normalization. The
            returned bytes are hash-equivalent to, but not necessarily byte-identical with, what the
            settler emitted (quotes are stored as JSONB, which normalizes on write). The gateway
            still never re-serializes the quote through a typed struct (that renormalizes timestamp
            values and WOULD change quote_hash), so the Go binding exposes it as a raw JSON passthrough.
          x-go-type: json.RawMessage
        awarded_payment_id:
          type: string
          nullable: true
          description: |
            payment_id if this quote was awarded; null otherwise. Under MVP single-award, at most
            one quote per batch carries a non-null value.
          example: "0x761989729fefb4b0cb8b3e6f787301a3878c91e8fba35ed362a079292879f34f"

    AwardedPayment:
      type: object
      description: A (quote_id, payment_id) pair for an awarded quote in a batch.
      required:
        - quote_id
        - payment_id
      properties:
        quote_id:
          type: string
          example: "0x9a3b...e8d4"
        payment_id:
          type: string
          example: "0x761989729fefb4b0cb8b3e6f787301a3878c91e8fba35ed362a079292879f34f"

    QuoteRequestResponse:
      type: object
      description: |
        Synchronous response to POST /v1/payments/quote-requests. The corridor fields are echoed
        at the response root. Keep the request body you sent: the award's `sender_auth` signs
        values from it that are not echoed here, such as its `request_id`, `quote_selector`,
        `escrow_contract_address` and `fulfillment_verifier`.

        The corridor echoed here describes the batch you actually receive. On an idempotent
        replay that is the ORIGINAL batch's corridor and window, which may differ from what you
        just sent in the ways a retry is allowed to differ (the deadlines, and address casing).
      required:
        - quote_request_id
        - status
        - idempotent_replay
      properties:
        quote_request_id:
          type: string
          description: Gateway-generated resource ID for the batch, used in subsequent status reads and awards.
          example: "qr_a1b2c3d4-5678-90ef-1234-567890abcdef"
        status:
          type: string
          enum:
            - collecting
            - ready
          description: |
            Collection-phase outcome of the create call:
            - `ready` — collection complete; `quotes` populated. If no settler bid, this is still
              `ready` with an empty `quotes` array (a successful "no quotes available" result —
              distinct from `expired`, which only applies to collected quotes that later lapse).
              When the gateway can tell why no settler was asked, `error` says why.
            - `collecting` — the sync wait cap fired before the quote deadline; poll the status endpoint for quotes.
            The `awarded` and `expired` lifecycle states are observed only via the status endpoint, not here.
          example: "ready"
        idempotent_replay:
          type: boolean
          description: |
            Whether this response describes a batch that already existed, rather than one opened
            by this request. `true` means the `request_id` had been used before and you are being
            handed the ORIGINAL batch — no second batch was opened and no second broadcast went
            out to settlement agents.

            **Re-attempting a quote-request.** Re-submit the same request and you get the same
            batch back. You may re-send the original bytes unchanged: `quote_deadline` bounds the
            collection window and is short, so it will usually have expired by the time you
            retry, and an expired deadline on a re-submission is not an error — the request is
            resolved onto the batch that already exists rather than used to open one.
            Re-signing with fresh deadlines is equally fine and returns the same batch.

            The window is NOT extended either way: it belongs to the batch, and `quote_deadline`
            in this response is the batch's own. Read `status` to see whether collection is
            still running.

            What you must not change under one `request_id` is the corridor's economics —
            accounts, assets, or amounts — which are rejected with 409
            IDEMPOTENCY_TERMS_MISMATCH rather than resolved onto the first batch. A genuinely
            different corridor needs a new `request_id`.

            Present on every response, `false` for a newly opened batch. A response without the
            field is from a gateway predating it, not a newly opened batch.
        source:
          $ref: '#/components/schemas/OwnedAsset'
        destination:
          type: array
          items:
            $ref: '#/components/schemas/OwnedAsset'
        fulfillment_amount:
          type: string
          example: "100000000"
        max_source_amount:
          type: string
          example: "101000000"
        fulfillment_deadline:
          type: string
          format: date-time
          example: "2026-04-29T12:30:00Z"
        quote_deadline:
          type: string
          format: date-time
          example: "2026-04-29T12:00:03Z"
        quotes:
          type: array
          description: Collected quotes. Present when status is `ready` — an empty array if no settler bid.
          items:
            $ref: '#/components/schemas/Quote'
        requested_count:
          type: integer
          description: |
            How many agents the request was broadcast to, so silence is distinguishable from a
            decline without a second call. Same meaning and same absence rule as on the status
            endpoint: absent means unknown, never zero.
          example: 8
        decline_summary:
          type: array
          description: |
            Why the request drew few or no quotes, carried here so that a `ready` response with an
            empty `quotes` array explains itself rather than requiring a follow-up read.

            Same counting rules as the status endpoint: every declining agent counted exactly once
            under its most recent reason, empty when nobody declined, absent when the detail could not
            be read. Provisional while `status` is `collecting`, because agents are still responding.
            When the gateway can tell why no settler was asked, `error` says why.
          items:
            $ref: '#/components/schemas/DeclineSummaryEntry'
        error:
          allOf:
            - $ref: '#/components/schemas/PaymentFailure'
          description: |
            Why the request has no quotes, when no settler was asked and the gateway can tell why:
            `NO_SETTLER_FOR_CORRIDOR` or `SERVICE_BUSY`. Same meaning and same absence rules as on
            the status endpoint.

    QuoteRequestAccepted:
      type: object
      description: |
        Asynchronous (202) response to POST /v1/payments/quote-requests. Returns the batch handle
        plus the echoed corridor; quotes are retrieved via the status endpoint.

        The corridor echoed here describes the batch you actually receive. On an idempotent
        replay that is the ORIGINAL batch's corridor and window, which may differ from what you
        just sent in the ways a retry is allowed to differ (the deadlines, and address casing).
      required:
        - quote_request_id
        - status
        - idempotent_replay
      properties:
        quote_request_id:
          type: string
          example: "qr_a1b2c3d4-5678-90ef-1234-567890abcdef"
        status:
          type: string
          enum:
            - collecting
          description: |
            Always `collecting` — a constant on this response, not a report of the batch's state.
            On an idempotent replay the batch's window may already have closed; read
            GET /v1/payments/quote-requests/{quoteRequestId} for its actual state.
          example: "collecting"
        idempotent_replay:
          type: boolean
          description: |
            Whether this response describes a batch that already existed, rather than one opened
            by this request. `true` means the `request_id` had been used before and you are being
            handed the ORIGINAL batch — no second batch was opened and no second broadcast went
            out to settlement agents.

            The idempotency contract is the same as on the synchronous (200) response: a
            re-submission may carry expired deadlines and is resolved onto the existing batch
            rather than rejected, the collection window is the batch's own and is not extended,
            and differing economics are rejected with 409 IDEMPOTENCY_TERMS_MISMATCH rather than
            collapsed onto the first batch.

            Present on every response, `false` for a newly opened batch. A response without the
            field is from a gateway predating it, not a newly opened batch.
        source:
          $ref: '#/components/schemas/OwnedAsset'
        destination:
          type: array
          items:
            $ref: '#/components/schemas/OwnedAsset'
        fulfillment_amount:
          type: string
          example: "100000000"
        max_source_amount:
          type: string
          example: "101000000"
        fulfillment_deadline:
          type: string
          format: date-time
          example: "2026-04-29T12:30:00Z"
        quote_deadline:
          type: string
          format: date-time
          example: "2026-04-29T12:00:03Z"

    QuoteRequestStatusResponse:
      type: object
      description: |
        Response to GET /v1/payments/quote-requests/{quoteRequestId}. The `status` enum describes
        the quote-request batch lifecycle and is disjoint from the payment-status enum.
      required:
        - quote_request_id
        - status
      properties:
        quote_request_id:
          type: string
          example: "qr_a1b2c3d4-5678-90ef-1234-567890abcdef"
        status:
          type: string
          enum:
            - collecting
            - ready
            - awarded
            - expired
          description: |
            Derived batch lifecycle, computed at read time (not a stored state machine). Disjoint
            from the payment-status enum returned by the award and payment-status endpoints.
            - `collecting` — collection window still open; `quotes` lists those collected so far
              (a quote is awardable from arrival, by its own `award_deadline`; more may arrive until
              `collection_close`).
            - `ready` — collection complete; none awarded yet; either at least one quote is still
              within its `award_deadline`, or no settler bid (empty `quotes` array — the successful
              "no quotes available" result). When the gateway can tell why no settler was asked,
              `error` says why.
            - `awarded` — a quote produced a payment row; no further awards accepted (MVP).
            - `expired` — collection closed, nothing awarded, and every collected quote is now past
              its `award_deadline` ("quotes lapsed"). An empty batch is `ready`, not `expired` — the
              two are deliberately distinct ("no quotes available" vs "quotes lapsed").
          example: "awarded"
        quotes:
          type: array
          description: Collected quotes with award linkage — those collected so far while `collecting`, the full set once the window closes.
          items:
            $ref: '#/components/schemas/AwardedQuote'
        payments:
          type: array
          description: Flat list of awarded (quote_id, payment_id) pairs. At most one entry under MVP single-award.
          items:
            $ref: '#/components/schemas/AwardedPayment'
        requested_count:
          type: integer
          description: |
            How many agents the request was broadcast to. The only auction count that is not
            derivable from the rest of this response:

            - quoted = `quotes` length
            - declined = sum of `decline_summary[].count`
            - participated = quoted + declined
            - silent = `requested_count` - participated

            Silence and a decline are different signals, which is why the denominator is surfaced
            rather than left implicit.

            ABSENT when the number is unknown, which happens when the broadcast count was never
            recorded or when the auction detail could not be read. Absence means unknown, never zero,
            so `silent` is derivable only when this field is present.
          example: 8
        decline_summary:
          type: array
          description: |
            Why the request drew few or no quotes, so a caller can tell "nobody can fund this right
            now" from "my request was malformed".

            EXHAUSTIVE over agents: every agent that declined is counted exactly once, under its most
            recent reason, so the counts sum to the number of agents that declined. An agent that
            declined more than once with different reasons is counted once, not once per reason.

            Empty means nobody declined. ABSENT means the auction detail could not be read, so the
            breakdown is unknown. While `status` is `collecting` it is provisional, because agents are
            still responding. When the gateway can tell why no settler was asked, `error` says why.

            The free-form decline detail is never relayed, because that detail carries an agent's
            balances and would let a caller map inventory by polling cheap quote-requests across
            corridors.
          items:
            $ref: '#/components/schemas/DeclineSummaryEntry'
        error:
          allOf:
            - $ref: '#/components/schemas/PaymentFailure'
          description: |
            Why the request has no quotes, when no settler was asked and the gateway can tell why.
            Present only on a closed request with an empty `quotes` array:

            - `NO_SETTLER_FOR_CORRIDOR`: no settler serves this source and destination pair, and
              `requested_count` is 0.
            - `SERVICE_BUSY`: no capacity was available to start the auction.

            Absent in every other case: while `status` is `collecting`; whenever a settler was
            asked (read `decline_summary` then); and when `requested_count` is absent for any reason
            other than `SERVICE_BUSY`, because whether a settler serves the pair is then unknown.
            `retry_classification` says what to do next.

    DeclineSummaryEntry:
      type: object
      required:
        - reason
        - count
      properties:
        reason:
          $ref: '#/components/schemas/DeclineReason'
        count:
          type: integer
          description: |
            Agents whose most recent decline reason was this one. Counts agents, never rows, and an
            agent appears under one reason only.
          example: 4
        retry_classification:
          type: string
          description: |
            What would have to change for a settler giving this reason to submit a price quote,
            drawn from the same closed set as the `retry_classification` on an error response so
            a caller reads one vocabulary.

            It describes the decline only. The authoritative instruction for the payment is the
            `retry_classification` on its own error response: a payment can fail for a reason no
            settler named, and it can succeed while some settlers declined.

            Optional, and a pattern-constrained string for the same reason `DeclineReason` is.
          pattern: "^[A-Z][A-Z0-9_]*$"
          example: "RETRY_AFTER_DELAY"
        docs_url:
          type: string
          format: uri
          description: |
            Link to the documentation for this reason. Absent rather than empty when no page is
            published, so a reader never follows a link to the site root.
          example: "https://docs.atum.xyz/decline-reasons#insufficient-liquidity"

    DeclineReason:
      type: string
      description: |
        A settler's reason for not bidding, projected from its internal reason code through
        the shared decline catalog (`apis/decline/v1/catalog.json`), which is the single
        source of truth for the reason set. Several internal codes may map to one public
        reason.

        Deliberately a pattern-constrained string rather than a closed enum. The set grows
        whenever a settler gains a cause worth naming, and a consumer whose generated client
        closes the set rejects the whole response on a value it has not seen. Treat an
        unrecognised value as `OTHER`.

        `OTHER` covers a reason whose detail is settler-authored free text, and any reason
        this gateway does not recognise. Both are counted so the summary stays exhaustive,
        without relaying text we neither author nor validate.
      pattern: "^[A-Z][A-Z0-9_]*$"
      example: "INSUFFICIENT_LIQUIDITY"

    AwardRequest:
      type: object
      description: |
        Request body for POST /v1/payments/awards: the quote request, the chosen quote and the
        two signatures that authorize the payment.
      required:
        - request_id
        - quote_request_id
        - quote_id
      properties:
        request_id:
          type: string
          description: |
            Idempotency key of this award call, scoped to the source account and originator. It
            shares one namespace with the `request_id` of POST /v1/payments, so use a value not
            used there. `sender_auth` commits to the quote request's `request_id`, not to this
            one.
          example: "award-2026-04-29-001"
        quote_request_id:
          type: string
          description: The `quote_request_id` returned when the quote request was opened.
          example: "qr_a1b2c3d4-5678-90ef-1234-567890abcdef"
        quote_id:
          type: string
          description: |
            The chosen quote's `quote_id`, as the quote-request endpoints return it: the content
            hash of the settler-signed quote, which the escrow commits on chain. One award names
            one quote.
          example: "0x9a3b...e8d4"
        sender_auth:
          allOf:
            - $ref: '#/components/schemas/SenderAuth'
          description: |
            Required. Signed by the owner of the quote request's `source.account`, as on
            POST /v1/payments, for exactly the chosen quote's `source_amount`. It names the
            quote request's `quote_selector` as the `reserver`.
        reserve_auth:
          allOf:
            - $ref: '#/components/schemas/ReserveAuth'
          description: |
            Required. The reserve message naming the chosen quote's settler, signed by the quote
            request's `quote_selector`.
        originator_auth:
          $ref: '#/components/schemas/VerifiableCredentialAuth'

    ReserveAuth:
      type: object
      description: |-
        The reserve message naming the chosen quote's settler, signed by the quote request's
        `quote_selector`. The escrow verifies it on chain against the `reserver` that
        `sender_auth` names. It binds the deposit, the chosen quote's `quote_id`, the quote's
        `settler_address` and its `source_amount`.

        - EVM and Tron: the message is the escrow's reserve witness, `{depositId, quoteHash,
          settler, sourceAmount}`. The deposit id is derived from the signed `sender_auth`,
          `keccak256(abi.encode(depositor, signature, nonce))` over the Permit2 signature and
          nonce, so sign `reserve_auth` after `sender_auth`. `message_prehash` is the witness as
          typed data (EIP-712, TIP-712 on Tron), a JSON string `{domain, types, primaryType,
          message}` with `primaryType` `ReserveWitness`. The domain is `name` `Escrow`, `version`
          `3`, `chainId` as 0x-prefixed hex without leading zeros (its lower 32 bits on Tron) and
          `verifyingContract` the escrow, with no other member except an empty `salt`. Addresses
          are 0x-prefixed hex, on Tron too, and `sourceAmount` is a decimal string. `message` is
          the typed data's digest, and `signature` the `quote_selector`'s signature over it. A
          contract wallet signs as it does for ERC-1271.
        - Solana: `message` is the escrow's reserve message hash, which binds the settler, the
          deposit hash that `sender_auth` signs, the quote hash and the source amount. None of
          these depends on the deposit signature, so the two can be signed in either order.
          `message_prehash` is the reserve record as a JSON string, `{deposit_hash, recipient,
          quote_hash, source_amount}`: the hashes as 0x-prefixed hex, `recipient` the settler's
          base58 address and `source_amount` a decimal string. `signature` is the
          `quote_selector`'s Ed25519 signature over `message`, so `quote_selector` must be a key
          that can sign.
        - Stellar: `message` is the escrow's reserve digest, which binds the settler, the deposit
          id (the deposit digest that `sender_auth` signs), the quote hash and the source amount.
          None of these depends on the delegate's signature, so the two can be signed in either
          order. `message_prehash` is the reserve record as a JSON string, `{deposit_id,
          quote_hash, settler, source_amount}`: the hashes as 0x-prefixed hex, `settler` a `G...`
          or `C...` address and `source_amount` a decimal string. `signature` is the
          `quote_selector`'s Ed25519 signature over `message`, so `quote_selector` must be a
          `G...` account whose key can sign.
      required:
        - message
        - message_prehash
        - signature
      properties:
        message:
          type: string
          description: The 0x-prefixed 32-byte digest that `signature` signs, on every chain.
          example: "0x5c0b4c7a3c5f5e1f8d3b0e2a9c7d6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c"
        message_prehash:
          type: string
          description: |-
            The signed reserve, as a JSON string: the typed data on EVM and Tron, the reserve
            record on Solana and Stellar, as described above.
        signature:
          type: string
          description: The `quote_selector`'s signature over `message`, 0x-prefixed hex on every chain.
          example: "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890ab1c"

    ChainDefaults:
      type: object
      description: |
        The addresses for one chain. Optional fields appear only where they apply to that
        chain; an absent optional field is not an error.
      required:
        - chain_id
        - quote_selector
        - escrow_contract
        - fulfillment_proxy
        - fulfillment_verifier
      properties:
        chain_id:
          type: string
          description: CAIP-2 identifier of the chain these defaults describe, normalised to lower case.
          example: "eip155:84532"
        quote_selector:
          type: string
          description: >-
            The account named as the reserver in the deposit authorization of
            POST /v1/payments. Sign against this exact value there; a deposit reserved by
            anyone else is rejected. An award names its quote request's own `quote_selector`
            instead, and a quote request may not name this one.
          example: "0xd0f080E23F95571D26eEb1FAD24a5F3d66835195"
        escrow_contract:
          type: string
          description: >-
            The escrow the deposit is made into, and the spender of the token approval.
            Empty when the chain is not fully configured.
          example: "0xa61a0C025943Aa79B73D8D07E3aDbEe1873738b4"
        fulfillment_proxy:
          type: string
          description: >-
            The contract that pays the receiver. Read this from the DESTINATION chain's
            defaults, not the source chain's. Empty when the chain is not fully configured.
          example: "0x09A5a0d6955E5394A661Cd9E7007076fa63B4158"
        fulfillment_verifier:
          type: object
          description: The service that attests settlement, and the account it signs with.
          required:
            - account
            - endpoint
          properties:
            account:
              type: string
              description: >-
                The account named as the releaser in the deposit authorization. Sign
                against this exact value.
              example: "0x27050EE47befC43F4dF7807a7AA8073039e5fa89"
            endpoint:
              type: string
              format: uri
              description: >-
                Base URL of the fulfillment verifier serving this chain.
              example: "https://veri-fill.example.com"
        permit2_contract:
          type: string
          minLength: 1
          description: >-
            The Permit2 this chain's escrow verifies against, sent only when it is not the
            canonical deployment. When absent, use the canonical Permit2 address for the
            chain. EVM and Tron only.
          example: "0x000000000022D473030F116dDEE9F6B43aC78BA3"
        tokens:
          type: array
          description: >-
            Tokens this chain's escrow accepts for deposit. Absent when the gateway has no
            listing for the chain, which does not mean no token is accepted.
          items:
            type: object
            required:
              - symbol
              - address
              - decimals
            properties:
              symbol:
                type: string
                example: "USDC"
              address:
                type: string
                description: Token contract address, in the chain's native address format.
                example: "0x036cbd53842c5426634e7929541ec2318f3dcf7e"
              decimals:
                type: integer
                description: Decimal places, for converting a human amount to base units.
                example: 6
        svm_signature_cluster_id:
          type: string
          description: >-
            Solana only. The cluster the escrow's signing domain is bound to, needed to
            build the deposit hash. Absent for EVM and Tron.
          example: "devnet"
        svm_signature_domain_version:
          type: integer
          minimum: 1
          description: >-
            Solana only. The escrow's signature domain version, which the deposit hash commits
            to. Absent for EVM and Tron.
          example: 5
        deposit_request_hash_version:
          type: integer
          minimum: 1
          description: >-
            The depositRequestHash version to sign for a deposit from this chain: 1 is
            keccak256 of the request_id, 2 is the hash of the payment terms, computed over the
            request body exactly as it is then posted. Absent means 1. Kept for clients that
            predate `deposit_request_hash_versions`, which a client should read instead: a deposit
            signed with version 1 is still accepted unless that list omits 1. It stays 2 once
            version 1 is no longer accepted, so a client that reads only this member keeps signing
            version 2.
          example: 2
        deposit_request_hash_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 1
          description: >-
            The depositRequestHash versions a deposit from this chain may be signed with,
            ascending: `[1]` before version 2, `[1, 2]` once the gateway publishes 2 in
            `deposit_request_hash_version`, and `[2]` once it no longer accepts version 1. A
            merchant lists exactly these in an x402 or MPP challenge. Absent means `[1, 2]` when
            `deposit_request_hash_version` is 2 and `[1]` otherwise, which is what a gateway that
            predates this member implies. Ignore a version you do not know.
          example: [1, 2]
        direct_deposit_request_hash_version:
          type: integer
          minimum: 1
          description: >-
            The depositRequestHash version this gateway derives an originator-executed (direct)
            deposit's id at, and so the version that deposit's witness must commit: 1 is keccak256
            of the request_id, 2 is the hash of the payment terms. Present on the chains a direct
            deposit can be made from (EVM). A deposit whose witness commits another version is
            still accepted by the escrow, under an id that names no payment, and comes back only
            through `refundUnreserved`. Absent from a gateway that predates this member: obtain
            the version from the gateway operator. Version 1 is deprecated for direct deposits.
            The gateway can change the version it derives at, so read this member for each direct
            deposit: a deposit funded at the old version and submitted after the change names no
            payment. A client that does not know the version must not make a direct deposit, since
            its deposit would name no payment: it upgrades instead. Unrelated to
            `deposit_request_hash_version` and `deposit_request_hash_versions`, which describe
            Permit2 signatures.
          example: 2

    GetDefaultsResult:
      description: >-
        Either one chain's defaults or every chain keyed by CAIP-2 chain id, depending on
        whether `chain_id` was supplied. A top-level `chain_id` identifies the first.
      oneOf:
        - $ref: '#/components/schemas/ChainDefaults'
        - $ref: '#/components/schemas/ChainDefaultsByChain'

    ChainDefaultsByChain:
      type: object
      description: >-
        Defaults for every chain the gateway serves, keyed by CAIP-2 chain id. Each key
        repeats the `chain_id` of the value it maps to.
      additionalProperties:
        $ref: '#/components/schemas/ChainDefaults'
      example:
        eip155:84532:
          chain_id: "eip155:84532"
          quote_selector: "0xd0f080E23F95571D26eEb1FAD24a5F3d66835195"
          escrow_contract: "0xa61a0C025943Aa79B73D8D07E3aDbEe1873738b4"
          fulfillment_proxy: "0x09A5a0d6955E5394A661Cd9E7007076fa63B4158"
          fulfillment_verifier:
            account: "0x27050EE47befC43F4dF7807a7AA8073039e5fa89"
            endpoint: "https://veri-fill.example.com"
