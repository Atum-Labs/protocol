openapi: 3.0.3
info:
  title: Atum Payment Gateway API
  description: |
    The Atum Payment Gateway API enables secure, cross-chain payments with built-in escrow protection 
    and settlement verification. This API facilitates decentralized payment routing across multiple blockchain 
    networks while ensuring transaction atomicity and settlement guarantees.
    
    ## Supported Blockchains
    - Ethereum and EVM-compatible chains (Arbitrum, Optimism, Base, etc.)
    - Solana
    - Tron
    - Stellar

    ## Authentication

    No API key, token, or authorization header is required on any operation.
    A payment carries its own authorization: the `sender_auth` signed messages prove
    control of the funding account, and are verified on every submission.
  version: 1.0.0
servers:
  - url: https://payment-gw.production-mainnet.atum.xyz
    description: Mainnet
  - url: https://payment-gw.production-testnet.atum.xyz
    description: Testnet
  - url: http://localhost:8080
    description: Local development server

# No operation requires credentials. An empty top-level `security` is how OpenAPI
# states that, and it stops code generators emitting auth parameters for an API
# that has none.
security: []

tags:
  - name: Payments
    description: Submit a payment and follow it to settlement, by payment id, by your own request id, or step by step.
  - name: Authorizations
    description: Counterparty authorization requested while a payment is being accepted.
  - name: Quote Requests
    description: The two-phase quote flow - open a quote-request batch, poll it, then award one quote.
  - name: Chain Defaults
    description: The per-chain corridor addresses a client needs before it can build and sign a payment.
  - name: Health
    description: Liveness probe for the gateway.

paths:
  /v1/payments:
    post:
      summary: Submit a payment request
      description: |
       Initiates a payment by submitting a cryptographically signed payment request.
        
        The payment gateway will:
        1. Validate the request and signatures
        2. Find optimal settlement routes across chains/assets
        3. Secure funds in escrow
        4. Coordinate with settlement agents for execution
        5. Return a real-time result if the payout reaches the destination chain inside the
           synchronous window, otherwise return a payment ID and status for polling

        **Idempotency.** `request_id` is the idempotency key, scoped to the source account
        and originator. Submitting the same `request_id` again returns the ORIGINAL payment
        instead of charging a second time, so a client whose request timed out or failed
        in transit can safely re-submit.

        Because a re-submission must be admissible on its own, some fields legitimately
        differ between attempts and are excluded from the comparison: `quote_deadline` and
        `fulfillment_deadline` (both must be in the future, so a later attempt has to move
        them), and the `sender_auth` signature they are signed into.

        A direct deposit, one you fund yourself before you submit, is the exception: the
        deposit commits the request (from depositRequestHash version 2, the
        `direct_deposit_request_hash_version` that `GET /v1/defaults` publishes, its deadlines
        too), so re-send the bytes you funded. A re-submission with other deadlines names a deposit
        you did not fund. If this `request_id` already holds a payment with otherwise the same
        terms, that payment is returned: check that its `payment_id` is the id of the deposit
        you funded before you act on it.

        What must NOT differ is the payment's economics — source account and asset,
        destination accounts and assets, `fulfillment_amount`, and `max_source_amount` (the
        payer's own risk cap; lowering it on a retry describes a different payment, not the
        same one with less headroom). Re-using one `request_id` for a genuinely different
        payment is a client bug that would otherwise be silently collapsed onto the first
        payment, so it is rejected with `409` and `IDEMPOTENCY_TERMS_MISMATCH`. Use a
        distinct `request_id` per payment.

        **Auto-accept.** With `auto_accept=true` the gateway awards the first valid quote it
        receives at or under `max_source_amount` instead of waiting for `quote_deadline`, so
        set `max_source_amount` to the price you accept. `quote_deadline` still bounds the
        quote window, and a request with no qualifying quote by then fails as usual. The flag
        is not part of the signed request and is never sent to settlers, although an award that
        arrives before `quote_deadline` shows the winning settler it was set. A re-submission
        returns the original payment, so the first submission's value applies.
      operationId: submitPayment
      tags:
        - Payments
      parameters:
        - name: auto_accept
          in: query
          required: false
          description: Award the first valid quote at or under `max_source_amount` instead of waiting for `quote_deadline`; faster, but gives up competitive pricing. Requires `max_source_amount`.
          schema:
            type: boolean
            default: false
        - name: X-Atum-Producer
          in: header
          required: false
          description: >-
            Optional. Names the client library that built the request body, such as `sdk-ts`,
            `sdk-go`, `x402` or `mppx`. Used for compatibility diagnostics only; it never changes
            how the payment is processed.
          schema:
            type: string
          example: sdk-ts
        - name: X-Atum-Deposit-Request-Hash-V2
          in: header
          required: false
          description: >-
            Optional. The depositRequestHash version 2 the client computed over the body it posts,
            as `0x` and 64 lowercase hex digits. The gateway checks it against its own reading of
            the body for compatibility diagnostics only; it is never trusted and never changes how
            the payment is processed. A client sends `X-Atum-Producer` without it when its reading
            refuses the body, which a version 2 deposit could not pay.
          schema:
            type: string
          example: "0x3f1c0e4f6d2b8a9c7e5d1b3a2f4c6e8d0b9a7c5e3d1f2b4a6c8e0d2f4b6a8c0e"
      requestBody:
        required: true
        description: |-
          The payment request. `sender_auth` is required unless `executor.deposit` is
          `originator`: a payer that funded the escrow deposit itself with `directDeposit`
          submits the request without it. A request that needs it and omits it is refused with
          `MISSING_SENDER_AUTH`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitPaymentRequest'
      responses:
        '200':
          description: Payment request submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid request, including `auto_accept=true` without `max_source_amount`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Signature or sender authorization could not be verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Refused before the payment was created.
            - `AUTHORIZATION_DECLINED`: declined during authorization. The reason is not included.
            - `AMOUNT_LIMIT_EXCEEDED`: over the per-payment amount limit for the paying account.
            - `VOLUME_LIMIT_EXCEEDED`: over the paying account's daily limit, which resets at
              00:00 UTC.

            Neither limit code states the limit's amount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The `request_id` has already been used for a payment with different economics
            (`IDEMPOTENCY_TERMS_MISMATCH`). Re-submitting one `request_id` is how a retry is
            made safe, so it must identify one payment; use a distinct `request_id` per
            payment.

            For a direct deposit, `code` `CONFLICT` with a `payment_id` means that payment holds
            terms other than the ones you sent, and it may hold the deposit you funded. Do not
            fund again under a new `request_id`. Re-send the exact bytes you funded: a `200` whose
            `payment_id` is the id of the deposit you funded is your payment, so follow it.
            `CONFLICT` again means no payment holds the deposit you funded on your terms: take it
            back with `refundUnreserved` while it is unreserved, then start again under a new
            `request_id` and deposit nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payment request too large to process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            With `code` `INSUFFICIENT_FUNDS` or `MISSING_TOKEN_APPROVAL`, the paying account could not
            fund the deposit: its source token balance, or its Permit2 approval, is below the amount
            this payment needs. Fix the paying account, then submit with a new `request_id`;
            re-submitting the same `request_id` answers `200` with `status` `failed` and
            `idempotent_replay` `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal server error. A body that carries a `payment_id` names a payment that exists and
            may still settle (with `code` `SETTLEMENT_OUTCOME_UNKNOWN`, settlement may already have
            started), so reconcile before acting: read `GET /v1/payments/{paymentId}/status`, where
            `paymentId` is that `payment_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: |
            With `code` `SETTLEMENT_FAILED`, settlement was attempted and did not complete. The
            on-chain outcome is not guaranteed either way, so reconcile before acting: read
            `GET /v1/payments/{paymentId}/status` for the failure detail and
            `GET /v1/payments/{paymentId}/timeline` for the chain trace, where `paymentId` is the
            `payment_id` in this body. Re-submitting the same `request_id` answers `200` with
            `status` `failed` and `idempotent_replay` `true`, so a genuine re-attempt needs a new
            `request_id`. A `502` with any other `code`, or none, is not a settlement failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The request was not accepted: a dependency is temporarily unavailable, an
            authorization check could not be completed (`AUTHORIZATION_UNAVAILABLE`), or
            this operation is paused (`SERVICE_PAUSED`). Nothing was submitted, so the
            request is safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/{paymentId}/status:
    get:
      summary: Get payment status
      description: Retrieve the status of a payment by its ID
      operationId: getPaymentStatus
      tags:
        - Payments
      parameters:
        - name: paymentId
          in: path
          required: true
          description: The ID of the payment to query
          schema:
            type: string
      responses:
        '200':
          description: Payment status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentStatusResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/resolve:
    get:
      summary: Resolve a request ID to a payment ID
      description: |
        Looks up the payment ID associated with a given client-supplied request ID.
        Used by tooling like the payment explorer so callers can look a payment up
        by the request ID they originally submitted.
      operationId: resolvePayment
      tags:
        - Payments
      parameters:
        - name: request_id
          in: query
          required: true
          description: The client-supplied request ID embedded in the payment request
          schema:
            type: string
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvePaymentResponse'
        '400':
          description: Missing request_id parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No payment found for the given request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/{paymentId}/timeline:
    get:
      summary: Get step-by-step payment timeline
      description: |
        Returns the settlement timeline for a payment, including every step the
        payment has passed through, per-step durations, chain IDs, transaction
        hashes, and — if the payment has failed — a structured error describing
        where and why it failed.
      operationId: getPaymentTimeline
      tags:
        - Payments
      parameters:
        - name: paymentId
          in: path
          required: true
          description: The ID of the payment to query
          schema:
            type: string
      responses:
        '200':
          description: Timeline retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTimelineResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/prepare:
    post:
      summary: Prepare an unsigned payment request
      description: |
        Generates an unsigned PaymentRequest object from human-readable inputs.
        This endpoint allows clients to:
        1. Use friendly asset identifiers (e.g., "ethereum/usdc" instead of full CAIP-19)
        2. Specify amounts in decimal format
        3. Get back a complete PaymentRequest with typed data (eg EIP-712 for EVM-compatible chains) ready for signing

        The response includes everything needed to sign and submit a payment, except the signature itself.

        Not available on every gateway or every source chain; where it is not, this
        returns `501`. Sign the returned request and submit it to `POST /v1/payments`.
      operationId: preparePayment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparePaymentRequest'
      responses:
        '200':
          description: Payment request prepared successfully
          headers:
            X-Atum-Deposit-Request-Hash-V2:
              description: >-
                The depositRequestHash version 2 of the prepared request body, as `0x` and 64
                lowercase hex digits, whichever version its deposit signs. Send it back in the
                `X-Atum-Deposit-Request-Hash-V2` request header of `POST /v1/payments` when you post
                the signed request unchanged. Absent when the body is not one version 2 can hash.
              schema:
                type: string
              example: "0x3f1c0e4f6d2b8a9c7e5d1b3a2f4c6e8d0b9a7c5e3d1f2b4a6c8e0d2f4b6a8c0e"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparePaymentResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Endpoint not yet implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/authorizations:
    post:
      summary: Request counterparty authorization
      description: |
        Submits a PaymentRequest for counterparty authorization before settlement.
        The call blocks synchronously until the beneficiary PSP responds or the
        timeout expires (default 30 seconds).

        If authorized, the response includes the counterparty's proof which can
        be attached to the subsequent SubmitPayment call.

        Authorization and RFQ submission are separate steps. This endpoint does
        NOT trigger an auction — the originator must call SubmitPayment separately.
      operationId: authorizePayment
      tags:
        - Authorizations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Authorization decision received (authorized or declined)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'
        '400':
          description: |
            The request was rejected before authorization was attempted, so no
            authorization outcome exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            The counterparty's proof was rejected (`PROOF_INVALID` or `PROOF_STALE`).
            This is an authorization outcome, so the body is an `AuthorizationResult`
            with `status: error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'
        '404':
          description: |
            Counterparty not found (no registration for the resolved DID). An
            authorization outcome, so the body is an `AuthorizationResult` with
            `status: error` and `error_code: COUNTERPARTY_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'
        '500':
          description: |
            Either shape, depending on where the failure happened. A failure before
            authorization was attempted returns `ErrorResponse`. A failure carrying an
            authorization outcome returns `AuthorizationResult` with `status: error`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/AuthorizationResult'
        '502':
          description: |
            Counterparty webhook error (HTTP error or connection failure). An
            authorization outcome, so the body is an `AuthorizationResult` with
            `status: error` and `error_code: WEBHOOK_ERROR` or
            `WEBHOOK_CONNECTION_ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'
        '504':
          description: |
            Authorization timed out (the counterparty did not respond). An
            authorization outcome, so the body is an `AuthorizationResult` with
            `status: timeout`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResult'

  /v1/payments/quote-requests:
    post:
      summary: Create a quote-request batch
      description: |
        Opens a quote-request batch: broadcasts the corridor to settlement agents and collects
        their signed quotes. This is the first phase of the two-phase quote → award flow — the
        originator later picks one quote and commits in a separate POST /v1/payments/awards call.
        No spend authorization is supplied here; `sender_auth` is deferred to award time.

        Wait modes (the `wait` query parameter):
        - `wait=false` (default): return 202 immediately with status `collecting`; poll
          GET /v1/payments/quote-requests/{quoteRequestId}. Quotes are listed as they arrive, and
          each can be awarded as soon as it is listed, so there is no need to wait for `ready`.
        - `wait=true`: hold the connection for up to
          min(quote_deadline, quote_sync_wait_seconds) and return 200 with the collected quotes
          (status `ready`). If the sync cap fires before the quote deadline, return 200 with
          status `collecting` and poll the status endpoint.

        Collection continues server-side until the quote deadline regardless of the HTTP
        connection, so quotes remain retrievable via the status endpoint in either mode.

        **Idempotency.** `request_id` is the idempotency key, scoped to the source account
        and originator — the same key, and the same contract, as POST /v1/payments.
        Submitting the same `request_id` again returns the ORIGINAL batch instead of opening
        a second one, so a client whose request timed out or failed in transit can safely
        re-submit and recover its `quote_request_id`.

        Because a re-submission must be admissible on its own, some fields legitimately
        differ between attempts and are excluded from the comparison: `quote_deadline` and
        `fulfillment_deadline` (both must be in the future, so a later attempt has to move
        them) and the `proof` that covers them. An expired `quote_deadline` on a
        re-submission is NOT an error — the request is resolved onto the batch that already
        exists rather than used to open one. There is no `sender_auth` to re-sign here: this
        endpoint rejects it, because the spend authorization belongs to the award call.

        The collection window belongs to the BATCH, not to the request. Asking again with a
        later `quote_deadline` does not extend a window already open; `quote_deadline` in the
        response is the batch's own, and `status` says whether collection is still running.

        What must NOT differ is the corridor's economics — source account and asset,
        destination accounts and assets, `fulfillment_amount`, and `max_source_amount`.
        Re-using one `request_id` for a genuinely different corridor is a client bug that
        would otherwise be silently collapsed onto the first batch, returning quotes for a
        corridor that was never requested. It is rejected with `409` and
        `IDEMPOTENCY_TERMS_MISMATCH`. Use a distinct `request_id` per quote-request.
      operationId: createQuoteRequest
      tags:
        - Quote Requests
      parameters:
        - name: wait
          in: query
          required: false
          description: Return a handle immediately (`false`, default) or hold the connection for collected quotes (`true`).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '200':
          description: |
            Quote-request resolved synchronously. `status` is `ready` when quotes were collected,
            or `collecting` when the sync wait cap fired before the quote deadline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequestResponse'
        '202':
          description: Quote-request accepted; collection continues asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequestAccepted'
        '400':
          description: |
            Invalid request. `QUOTE_DEADLINE_NOT_FUTURE` is the one worth planning for: a NEW
            quote-request whose `quote_deadline` has already passed is refused, because there is
            no window left to collect quotes in. It does not apply to a re-submission — an
            already-used `request_id` resolves onto the batch that exists and its expired
            deadline is ignored, which is what makes a retry recoverable.

            `MISSING_QUOTE_SELECTOR`: the request names no `quote_selector`.

            `QUOTE_SELECTOR_NOT_ALLOWED`: `quote_selector` names the gateway's own selector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The `request_id` has already been used for a quote-request with different
            economics (`IDEMPOTENCY_TERMS_MISMATCH`). Re-submitting one `request_id` is how a
            retry is made safe, so it must identify one batch; use a distinct `request_id`
            per quote-request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The request was not accepted: a dependency is temporarily unavailable, or
            this operation is paused (`SERVICE_PAUSED`). Nothing was submitted, so the
            request is safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/quote-requests/{quoteRequestId}:
    get:
      summary: Get quote-request batch status
      description: |
        Returns the current state of a quote-request batch: a derived status, the collected
        quotes (each with its settler-signed `award_deadline`), and the awarded
        (quote_id, payment_id) pairs once a quote has been awarded. Used for async polling,
        connection-drop recovery, and re-reading quotes before awarding.

        The `status` here describes the quote-request batch lifecycle
        (`collecting`/`ready`/`awarded`/`expired`) and is disjoint from the payment-status enum
        returned by the award and payment-status endpoints.
      operationId: getQuoteRequestStatus
      tags:
        - Quote Requests
      parameters:
        - name: quoteRequestId
          in: path
          required: true
          description: The ID of the quote-request batch to query
          schema:
            type: string
      responses:
        '200':
          description: Quote-request status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequestStatusResponse'
        '404':
          description: Quote-request not found, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/awards:
    post:
      summary: Award a quote
      description: |
        Commits to a payment by awarding one quote from a quote request. Name the quote request
        and the chosen quote, and send two signatures:

        - `sender_auth`, signed by the owner of the quote request's `source.account`: the
          deposit of exactly the chosen quote's `source_amount`. It names the quote request's
          `quote_selector` as the account that picks the settler (the `reserver` in the Permit2
          witness).
        - `reserve_auth`, signed by that `quote_selector`: the reserve message naming the chosen
          quote's settler.

        An originator paying from its own `source.account` signs both with the same wallet. A
        payment service provider paying for a customer names its own address as
        `quote_selector`, so the customer signs only `sender_auth`.

        **Award deadline.** Each quote carries an `award_deadline`, the time until which its
        settler holds the quoted price. Every settler sets its own, counted from its bid, so time
        spent waiting for more quotes comes out of the time left to award. A quote can be awarded
        as soon as it is listed. Reading the quotes, signing and posting the award all have to
        happen before its `award_deadline`, and an award that arrives too close to it is refused
        with `422` `QUOTES_EXPIRED`.

        **Idempotency.** `request_id` is the idempotency key of the award call, scoped to the
        source account and originator. It shares one namespace with the `request_id` of
        POST /v1/payments, so use a value you have not used there. Re-sending the same award
        under the same `request_id` returns the original payment with `idempotent_replay`
        `true`, even after the quote's `award_deadline` has passed or the quote request reads as
        awarded, so a client whose award timed out in transit can safely re-send it. A re-send
        answers `200` at once, in either wait mode, with the payment's current `status`. An award
        is the same when `quote_request_id` and `quote_id` match; re-signed `sender_auth` and
        `reserve_auth` are not compared. The same `request_id` with a different
        `quote_request_id` or `quote_id` is rejected with `409` `IDEMPOTENCY_TERMS_MISMATCH`.

        **One award per quote request.** Once a quote of a quote request has been awarded, a
        further award against it is rejected with `409` `QUOTE_REQUEST_ALREADY_AWARDED`, and the
        quote request's status lists the awarded payment.

        From this call on, the payment reads exactly as one submitted to POST /v1/payments: the
        response is a `PaymentResponse`, and GET /v1/payments/{paymentId}/status reports the
        same `status`.

        Wait modes (the `wait` query parameter):
        - `wait=false` (default): return `202` immediately with `payment_id` and `status`
          `pending`; poll GET /v1/payments/{paymentId}/status.
        - `wait=true`: hold the connection for the synchronous window and return `200` with the
          payment's state when it ends. The window also ends when the payment reaches
          `finalizing`. If it runs out first, `status` is `pending`; poll
          GET /v1/payments/{paymentId}/status. A settlement that fails inside the window is
          answered as on POST /v1/payments, with `422` or `502`.
      operationId: awardQuote
      tags:
        - Quote Requests
      parameters:
        - name: wait
          in: query
          required: false
          description: Return a handle immediately (`false`, default) or hold the connection for the payment result (`true`).
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardRequest'
      responses:
        '200':
          description: |
            `wait=true`: the synchronous window ended. `status` is the payment's state at that
            moment, `pending` when the window ran out before the payout reached the destination
            chain. A re-sent award also answers `200`, at once and in either wait mode, with the
            payment's current `status` and `idempotent_replay` `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '202':
          description: |
            `wait=false`: a new award was accepted and settlement continues. `status` is
            `pending`; poll GET /v1/payments/{paymentId}/status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: |
            Invalid award. Nothing was created, so the same `request_id` may be sent again once
            the body is fixed. The award-specific codes:
            - `MISSING_SENDER_AUTH` or `MISSING_RESERVE_AUTH`: a signature is missing.
            - `RESERVER_MISMATCH`: `sender_auth` names a `reserver` other than the quote
              request's `quote_selector`.
            - `PERMIT_AMOUNT_MISMATCH`: `sender_auth` authorizes an amount other than the chosen
              quote's `source_amount`.
            - `PERMIT_TOKEN_MISMATCH`: `sender_auth` authorizes a token other than the quote
              request's source asset.
            - `RESERVE_AUTH_INVALID`: `reserve_auth` is malformed, or does not name this deposit
              and the chosen quote's hash, settler and `source_amount`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            A signature could not be verified. `UNAUTHENTICATED` when `sender_auth` does not
            verify, as on POST /v1/payments. `AWARD_SIGNER_MISMATCH` when `reserve_auth` is not
            signed by the quote request's `quote_selector`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Refused before the payment was created.
            - `AUTHORIZATION_DECLINED`: declined during authorization. The reason is not included.
            - `AMOUNT_LIMIT_EXCEEDED`: over the per-payment amount limit for the paying account.
            - `VOLUME_LIMIT_EXCEEDED`: over the paying account's daily limit, which resets at
              00:00 UTC.

            Neither limit code states the limit's amount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `QUOTE_REQUEST_NOT_FOUND`: no quote request with this `quote_request_id` exists for
            this originator. `QUOTE_NOT_FOUND`: the quote request holds no quote with this
            `quote_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `QUOTE_REQUEST_ALREADY_AWARDED`: a quote of this quote request has already been
            awarded, and its payment is listed on the quote request's status.
            `IDEMPOTENCY_TERMS_MISMATCH`: this `request_id` was already used for a different
            award or payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `QUOTES_EXPIRED`: the chosen quote's `award_deadline` has passed, or is too close to
            award the quote before it does. Award a quote that is still open, or open a new quote
            request.

            With `wait=true`, `INSUFFICIENT_FUNDS` or `MISSING_TOKEN_APPROVAL`: the paying account
            could not fund the deposit: its source token balance, or its Permit2 approval, is below
            the chosen quote's `source_amount`. The quote request stays awarded, so fix the paying
            account, then open a new quote request; re-sending the same award answers `200` with
            `status` `failed` and `idempotent_replay` `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            Internal server error. A body that carries a `payment_id` names a payment that exists
            and may still settle, so read GET /v1/payments/{paymentId}/status before acting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: |
            With `wait=true` and `code` `SETTLEMENT_FAILED`, settlement was attempted and did not
            complete. The on-chain outcome is not guaranteed either way, so reconcile before acting:
            read `GET /v1/payments/{paymentId}/status` for the failure detail and
            `GET /v1/payments/{paymentId}/timeline` for the chain trace, where `paymentId` is the
            `payment_id` in this body. Re-sending the same award answers `200` with `status`
            `failed` and `idempotent_replay` `true`, and the quote request stays awarded, so a
            genuine re-attempt needs a new quote request. A `502` with any other `code`, or none,
            is not a settlement failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The request was not accepted: a dependency is temporarily unavailable, an
            authorization check could not be completed (`AUTHORIZATION_UNAVAILABLE`), or
            this operation is paused (`SERVICE_PAUSED`). Nothing was submitted, so the
            request is safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/defaults:
    get:
      summary: Get chain defaults
      description: |
        The addresses needed to build a payment on a chain: the escrow, the accounts named
        in the deposit authorization, and the fulfillment verifier. Fetch these rather than
        hardcoding them - they change when a chain's contracts are redeployed.

        With `chain_id`, returns that chain. Without it, or with an empty value, returns
        every chain the gateway serves, keyed by CAIP-2 chain id.

        A chain that is not fully configured is still returned when asked for by
        `chain_id`, with the missing address empty, but is left out of the full listing.
        Treat an empty address as a chain you cannot pay on.
      operationId: getDefaults
      tags:
        - Chain Defaults
      parameters:
        - name: chain_id
          in: query
          required: false
          description: >-
            CAIP-2 chain identifier. Omit it, or send it empty, to receive every chain
            the gateway serves, keyed by chain id.
          schema:
            type: string
          example: "eip155:84532"
      responses:
        '200':
          description: >-
            Chain defaults. A single object when `chain_id` was supplied, otherwise an
            object keyed by CAIP-2 chain id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDefaultsResult'
        '400':
          description: The `chain_id` is not a valid CAIP-2 chain identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            The requested chain is not served by this gateway, or - when `chain_id` was
            omitted - no chain could be resolved at all
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: A dependency is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check
      description: Returns the health status of the service
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    AuthorizationResult:
      type: object
      description: |
        The result of a counterparty authorization request. Contains either
        the PSP's authorization decision (authorized/declined with proof) or
        an error indicating why authorization could not be completed.
      required:
        - payment_id
        - counterparty_did
        - status
      properties:
        payment_id:
          type: string
          description: Correlation key for this authorization
          example: "0x761989729fefb4b0cb8b3e6f787301a3878c91e8fba35ed362a079292879f34f"
        counterparty_did:
          type: string
          description: The beneficiary PSP's DID
          example: "did:pkh:eip155:1:0xdeadbeef"
        status:
          type: string
          description: |
            Authorization outcome. "authorized" or "declined" when the PSP responded.
            "error" or "timeout" when the authorization could not be completed.
          enum:
            - authorized
            - declined
            - error
            - timeout
          example: "authorized"
        authorization_response:
          type: object
          description: The PSP's raw authorization response (present when status is authorized or declined)
          additionalProperties: true
        error_code:
          type: string
          description: |
            Machine-readable error code (present when status is error or timeout).
            Counterparty-sourced codes are derived from the error code the
            Counterparty Gateway publishes. GATEWAY_TIMEOUT, PROOF_INVALID, and
            PROOF_STALE are raised by this gateway itself (no counterparty envelope corresponds).
          enum:
            - COUNTERPARTY_NOT_FOUND
            - COUNTERPARTY_TIMEOUT
            - WEBHOOK_ERROR
            - WEBHOOK_CONNECTION_ERROR
            - INTERNAL_ERROR
            - GATEWAY_TIMEOUT
            - PROOF_INVALID
            - PROOF_STALE
          x-enum-description: |
            COUNTERPARTY_NOT_FOUND, COUNTERPARTY_TIMEOUT, WEBHOOK_ERROR,
            WEBHOOK_CONNECTION_ERROR, and INTERNAL_ERROR are derived from the
            error code the Counterparty Gateway publishes.
            GATEWAY_TIMEOUT is emitted by the gateway when no authorization
            response is received within the system-wide timeout — source unknown
            (counterparty delay, transport failure, or gateway unavailability).
            Originator should retry; counterparty-side idempotency prevents PSP re-charge
            if the original was already processed.

            PROOF_INVALID is emitted when the W3C Data Integrity proof on the
            beneficiary PSP's AuthorizationResponse fails verification: signature
            recovery failed, recovered DID does not match the destination DID,
            response shape is malformed (missing @context / payment_id /
            counterparty_did / proof), or the suite type is unsupported. The
            underlying reason cardinality is collapsed so originators see one
            actionable category.

            PROOF_STALE is emitted when proof.created falls outside the
            configured freshness window. Originators should retry with a fresh
            request — the freshness window closes a replay attack vector where a
            captured-but-cryptographically-valid proof could otherwise be replayed
            indefinitely.
        error_message:
          type: string
          description: Human-readable error description
        webhook_http_status:
          type: integer
          description: HTTP status code from the PSP webhook (only for WEBHOOK_ERROR)

    PaymentRequest:
      description: |-
        Structured payment request with sender authorization and optional W3C Verifiable Credentials
      type: object
      required:
        - version
        - request_id
        - source
        - destination
        - fulfillment_amount
        - sender_auth
        - quote_deadline
        - fulfillment_deadline
        - fulfillment_verifier
        - escrow_contract_address
      properties:
        version:
          type: string
          description: Semver-shaped declaration version (MAJOR.MINOR). The major component is locked to this schema's parent directory (v1 → major must be 1). Producers MUST emit the canonical value exported by the bindings' Version constant; the canonical bumps on each additive minor evolution.
          pattern: ^1\.[0-9]+$
          example: "1.0"
        request_id:
          type: string
          description: Unique identifier for this payment request (used for idempotency)
          example: req_123456789
        source:
          $ref: '#/components/schemas/OwnedAsset'
        destination:
          type: array
          description: |-
            Array of destination assets for the settlement agent to choose from (at least one required, at most 16).
            The ceiling bounds the fan-out one request can buy: every consumer iterates this list.
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OwnedAsset'
        fulfillment_amount:
          type: string
          description: |-
            The exact amount to be received at the destination (in the smallest unit, e.g., wei for ETH, cents for USD).
          minLength: 1
          pattern: ^[0-9]+$
          example: "1000000"
        max_source_amount:
          type: string
          description: The maximum amount willing to be spent from the source (in the smallest unit).
          minLength: 1
          pattern: ^[0-9]+$
          example: "1000000"
        quote_deadline:
          type: string
          format: date-time
          description: |-
            Required. The deadline for receiving price quotes from settlement providers. After this
            point no new quotes are accepted. The gateway injects no default and validates the value
            is in the future. The originator must supply it, and a request that omits it or supplies
            a past value is rejected with 400.

            Keep this window short. A settler holds its quoted price for a limited period of its
            own choosing, and the gateway selects only once the window has closed, so a deadline
            set beyond that hold leaves no quote still awardable and the request is declined with
            QUOTE_WINDOW_TOO_LONG. That hold is set by each settler and is not part of this
            contract, so treat 60 seconds as a practical upper bound and prefer a shorter window
            where your integration allows. A submit with auto_accept can be awarded before the
            window closes, but settlers still decline a window longer than their hold, so keep it
            short either way.

            Do not make it too short either. A settler that has work to do before it can quote,
            such as sourcing the payout asset through a swap, and cannot finish it by this deadline
            declines with QUOTE_WINDOW_TOO_SHORT. Once the payment has failed, reissue it with a
            longer quote_deadline. That work time also varies by settler, so there is no fixed
            minimum. A settler waiting on another service cannot tell slow from down, so if the
            longer window is declined with a reason whose retry_classification is not
            NOT_RETRYABLE_FIX_REQUEST, the cause is on the settler's side, not in your request.

            Both bounds are counted from when a settler receives the request, not from when you
            built it. A direct deposit signed at depositRequestHash v2 commits quote_deadline, so
            you fix it before depositing: leave room for your deposit transactions and the finality
            wait before the POST, on top of the window the settlers need. A reissue is a new
            deposit, so recover the first one with refundUnreserved once the payment has failed,
            not before.
          example: "2024-12-25T10:30:00Z"
        fulfillment_deadline:
          type: string
          format: date-time
          description: |-
            Required. The time by which the payout to the recipient must be mined on the destination
            chain. If no payout is mined by then, your escrowed funds are refunded. The payout does
            not have to be final by then: `completed` follows once the
            destination chain judges it final. Leave room for your deposit to confirm on the source
            chain first, which on some chains takes minutes. The gateway injects no default
            and validates the value is in the future. The originator must supply it, and a request
            that omits it or supplies a past value is rejected with 400.
          example: "2024-12-25T11:00:00Z"
        executor:
          description: Who performs each leg of the payment. Omitted on the wire means settler for every leg. The split object keeps deposit, reserve, and fulfill as separate keys.
          oneOf:
            - type: string
              enum:
                - settler
                - originator
            - type: object
              additionalProperties: false
              required:
                - deposit
                - reserve
                - fulfill
              properties:
                deposit:
                  type: string
                  enum:
                    - settler
                    - originator
                reserve:
                  type: string
                  enum:
                    - settler
                    - originator
                fulfill:
                  type: string
                  enum:
                    - settler
                    - originator
        deposit_nonce:
          type: string
          description: 'The nonce the payer passed to the escrow''s directDeposit, as a decimal uint256. Only on an originator-executed deposit (executor.deposit is originator), where it is required: with the source account, chain and escrow it names the deposit the payer funded. Each nonce funds one deposit per account, forever.'
          minLength: 1
          maxLength: 78
          pattern: ^[0-9]+$
        settler_auth_required:
          type: object
          description: Policy requirements for settler authentication. Keys are policy names, values indicate if the policy is required.
          additionalProperties:
            type: boolean
        sender_auth:
          $ref: '#/components/schemas/SenderAuth'
        originator_auth:
          $ref: '#/components/schemas/VerifiableCredentialAuth'
        quote_selector:
          type: string
          description: The account that picks the settler and signs the reserve that commits the deposit to the chosen quote. When set, it must be the reserver that the payer's signed authorization names.
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        fulfillment_verifier:
          type: object
          description: |-
            The verification service that confirms the payment was delivered before the escrow
            releases the source funds, and the account it signs with. Required on every chain:
            the gateway's `/v1/defaults` response supplies it for each chain.
          required:
            - account
            - endpoint
          properties:
            account:
              type: string
              description: The wallet address or public key of the verification service
              example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
            endpoint:
              type: string
              format: uri
              description: |-
                Origin of the fulfillment verifier service, with no path — the caller
                appends the verifier's own API paths. The gateway's `/v1/defaults` response
                supplies the default fulfillment verifier for each chain.
              example: https://veri-fill.production-testnet.atum.xyz
        escrow_contract_address:
          type: string
          description: Escrow contract on the source chain that holds the source funds until proof of fulfillment has been verified. Required on every chain. Take the value for the source chain from the payment gateway's GET /v1/defaults (`escrow_contract`).
          example: "0x742D35cC6634c0532925a3b844Bc9e7595F41360"
        fulfillment_proxy:
          type: string
          description: |-
            Fulfillment Proxy contract address, used to emit proof of fulfillment on the destination chain. Leave empty to use the default.
          example: "0x892BB2e4F6b14a2B5b82Ba8d33E5925D42D4431F"
        settler_requirements:
          type: object
          description: Optional settler filtering requirements. If whitelist is present, only whitelisted settlers may win. If blacklist is present, blacklisted settlers are excluded. Both can be specified; blacklist takes precedence (a settler in both lists is rejected).
          properties:
            whitelist:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 100
              description: List of settler DIDs permitted to fulfill this request. If present and non-empty, only these settlers may win. Use W3C DID format (e.g., did:pkh:eip155:1:0xABC...).
              items:
                type: string
                pattern: ^did:[a-z][a-z0-9]*:[a-zA-Z0-9._:%-]+$
              example:
                - did:pkh:eip155:1:0x742D35cC6634c0532925a3b844Bc9e7595F41360
            blacklist:
              type: array
              uniqueItems: true
              minItems: 1
              maxItems: 100
              description: List of settler DIDs excluded from fulfilling this request. If present and non-empty, these settlers are rejected. Use W3C DID format (e.g., did:pkh:eip155:1:0xABC...).
              items:
                type: string
                pattern: ^did:[a-z][a-z0-9]*:[a-zA-Z0-9._:%-]+$
              example:
                - did:pkh:eip155:1:0x892bb2E4F6b14a2B5b82bA8D33e5925d42d4432f

