version: v2
modules:
  - path: .
    # Exclude generated bindings (and their node_modules, which ship their own
    # .proto files) so lint/generate only see this module's settler.proto.
    excludes:
      - bindings
lint:
  use:
    - STANDARD
  except:
    # package atum.settler.v1 is the deployed wire contract shared with atum-core
    # and settler-agent. It cannot be renamed or relocated into an atum/settler/v1
    # directory to satisfy these stylistic rules without breaking that contract.
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - WIRE_JSON
