# Verify that every Go module works when resolved on its own.
#
# Kept out of ci.yml, which runs on every PR: this lane resolves and tests every module from a
# throwaway module cache, too slow to put in front of PRs that cannot affect it. It runs on the
# PRs that can -- those touching a go.mod -- plus main, nightly, and on demand before tagging.
#
# What it catches that no other lane can: every other job builds from a full checkout, so each
# module sees the whole repo on disk. A consumer sees only that module's own directory. A file
# read from two directories up works in CI and fails on first use for everyone else. Sibling
# versions are resolved at HEAD here; `release tag` checks them as written before publishing.
name: Standalone modules

on:
  push:
    branches: [main]
  # Only PRs that add or change a module. Running solely after merge meant a module that a
  # consumer could not resolve went green on its PR and turned main's lane red afterwards, so the
  # lane has to see the PR that introduces one.
  pull_request:
    paths:
      - "**/go.mod"
      - "tooling/verify-standalone-modules.*"
      - ".github/workflows/standalone-modules.yml"
  schedule:
    # 03:17 UTC. Off the hour to avoid the GitHub-wide contention at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-modules-${{ github.ref }}
  # Cancel superseded PR runs only; never cut a run on main short.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Resolve every Go module as a consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The script builds a bare mirror of this repo and tags each module in it, so it
          # needs real history rather than the default depth-1 checkout.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - name: Verify
        shell: bash
        run: ./tooling/verify-standalone-modules.sh
