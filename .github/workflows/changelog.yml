# owner: @atum-labs/core-team

name: Changelog

# Fails when a pull request changes a publishable package, or a workspace package
# that one bundles, without a new entry in that package's CHANGELOG.md. A PR with
# nothing to announce adds the "changelog: none" label and a line
# "Changelog: none — <reason>" to its description. Also lints every publishable
# package's CHANGELOG.md.

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - edited

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR head, with full history so the merge base with main is reachable.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # pnpm lists the workspace projects; no install is needed for that.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Check changelog entries
        # Labels and description reach the script only through env, never the shell.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tooling/publish-guard/bin/publish-guard.mjs changelog pr-check --base "$BASE_SHA" --head "$HEAD_SHA"
